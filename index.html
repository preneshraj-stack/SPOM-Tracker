<style>

/* Modern navy dashboard theme inspired by the requested reference; all tracker logic/features remain intact. */
:root{--bg:#050d1a;--cd:#0b1729;--ink:#eef5ff;--mu:#9eb2d0;--ln:#1d3557;--ac:#168bff;--soft:#102b4d;--rv:#a855f7;color-scheme:dark}
html,body{min-height:100%;background:radial-gradient(ellipse at 65% -15%,#122b50 0%,#071326 43%,#040b15 100%);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
main{max-width:none;width:auto;margin:0 20px 0 245px;padding:24px 22px 48px}

a{color:#67b7ff}button:focus-visible,a:focus-visible{outline:2px solid #39b9ff;outline-offset:2px}

/* Dashboard polish */
:root{--bg:#06101f;--cd:#0b1a2e;--ink:#edf5ff;--mu:#9bb0cb;--ln:#203958;--ac:#2388ff;--soft:#102943;--rv:#9b72ff}
body{background:radial-gradient(ellipse at 75% -20%,#173a66 0%,#071427 42%,#040a14 100%)}
.welcome{display:flex;align-items:center;justify-content:space-between;min-height:118px;padding:22px 24px;background:linear-gradient(115deg,rgba(17,68,126,.72),rgba(10,26,46,.96) 65%);overflow:hidden;position:relative}
.welcome h2{color:#f5f9ff}.welcome-mark{font-size:76px;color:#46c9ff;opacity:.8;padding:0 18px;text-shadow:0 0 28px rgba(35,136,255,.4)}

.module-info{flex:1;min-width:0}.module-info b{font-size:12px;display:block;margin-bottom:8px}.module-info small{display:block;color:var(--mu);font-size:11px;margin-top:6px}.module-row>strong{font-size:15px}

.mock-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);font-size:12px}.mock-row span small{display:block;color:var(--mu);font-size:10px;margin-top:3px}.mock-row strong{color:#6ed9ff}
.resource-link{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--ln);color:#d8eaff;text-decoration:none;font-size:13px}.resource-link:hover{color:#69c9ff}.resource-link b{color:#6dbbff;font-size:17px}
.days small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
button,a,input,select,textarea{transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #45c8ff;outline-offset:3px}
@media(max-width:900px){main{margin-left:225px}.grid-two{grid-template-columns:1fr}.dashboard-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){main{margin:0}.welcome{padding:18px;min-height:100px}.welcome-mark{font-size:52px;padding:0 4px}.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-stats .stat:last-child{grid-column:1/-1}.exam-grid{grid-template-columns:1fr 1fr}}

</style></head><body><main>
<h1>SPOM Tracker</h1>
<p class="sub">Set A: Corporate &amp; Economic Laws · Set B: Strategic Cost &amp; Performance Management</p>
<nav id="nav"></nav><div id="v"></div>
</main>
<script>
const SETS=[
{n:"Set A · Corporate & Economic Laws",p:"a",c:["Co. Law 1 · Appointment & Qualification of Directors","Co. Law 2 · Managerial Personnel: Appointment & Remuneration","Co. Law 3 · Meetings of Board & Its Powers","Co. Law 4 · Inspection, Inquiry & Investigation","Co. Law 5 · Compromises, Arrangements & Amalgamations","Co. Law 6 · Prevention of Oppression & Mismanagement","Co. Law 7 · Winding Up","Co. Law 8 · Miscellaneous Provisions","Co. Law 9 · Adjudication, Special Courts, NCLT & NCLAT","Co. Law 10 · e-Filing","Securities Laws · SEBI Act, LODR, ICDR, SAST, PIT","Economic Laws 1 · FEMA, 1999","Economic Laws 2 · FCRA, 2010","Economic Laws 3 · IBC, 2016"]},
{n:"Set B · Strategic Cost & Performance Mgmt",p:"b",c:["1 · Intro to Strategic Cost Management","2 · Modern Business Environment","3 · Lean System & Innovation","4 · Specialist Cost Management Techniques","5 · Cost Management for Emerging Business Models","6 · Strategic Revenue Management","7 · Strategic Profit Management","8 · Intro to Strategic Performance Management","9 · Performance Measures in Private Sector","10 · Performance Measures in Not-for-Profits","11 · Preparation of Performance Reports","12 · Divisional Transfer Pricing","13 · Standard Costing","14 · Case Study"]}];
const TOTAL=SETS.reduce((a,s)=>a+s.c.length,0);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=t=>new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const back=n=>{const t=new Date();t.setDate(t.getDate()-n);return iso(t)};
let me={ch:{},logs:[],mocks:[]},all={},names={},uid=null,ref=null,tab="dash",msg="";
try{const x=JSON.parse(localStorage.getItem("spom_me")||"null");if(x)me=Object.assign(me,x)}catch(e){}
const $=s=>document.getElementById(s);
function stats(d){const days={};(d.logs||[]).forEach(l=>days[l.d]=(days[l.d]||0)+l.h);
 let wk=0;for(let i=0;i<7;i++)wk+=days[back(i)]||0;
 let st=0,i=days[back(0)]?0:1;while(days[back(i)]){st++;i++}
 const done=Object.values(d.ch||{}).filter(v=>v>0).length,m=(d.mocks||[]).slice(-1)[0];
 return{days,wk,st,done,pct:Math.round(done/TOTAL*100),mk:m?Math.round(m.m/m.t*100):null}}
async function save(){try{localStorage.setItem("spom_me",JSON.stringify(me))}catch(e){}if(!ref)return;try{await ref.set(JSON.parse(JSON.stringify(me)));msg=""}catch(e){msg="Couldn’t sync. Ask the owner to share the page with you as a Contributor."}render()}
function addLog(){const h=parseFloat($("h").value);if(!(h>0&&h<=20))return;me.logs.push({d:$("d").value||back(0),s:$("s").value,h,n:$("n").value.slice(0,80)});me.logs=me.logs.slice(-300);save();render()}
function delLog(i){me.logs.splice(i,1);save();render()}
function cyc(id){const v=((me.ch[id]||0)+1)%5;me.ch[id]=v;if(v==1)conf();save();render()}
function addMock(){const m=parseFloat($("m").value),t=parseFloat($("t").value);if(!(t>0&&m>=0&&m<=t))return;me.mocks.push({d:back(0),s:$("ms").value,m,t});me.mocks=me.mocks.slice(-100);save();render()}
function delMock(i){me.mocks.splice(i,1);save();render()}
function setExam(){me.exam=$("ex").value||"";save();render()}
function countdown(s){
 const rem=TOTAL-s.done;
 let h=`<div class="card"><div class="row"><b class="grow">Exam countdown</b><input id="ex" type="date" value="${E(me.exam||"")}" onchange="setExam()"></div>`;
 if(me.exam){const dl=Math.round((new Date(me.exam+"T00:00")-new Date(back(0)+"T00:00"))/864e5);
  if(dl>0)h+=`<p style="margin:10px 0 0"><span style="font-size:28px;font-weight:600">${dl}</span> days left · ${Math.floor(dl/7)} weeks${rem?`<br><span class="note">${rem} chapters not yet studied, about ${(rem/Math.max(dl/7,1)).toFixed(1)} a week to finish them all</span>`:""}</p>`;
  else if(dl==0)h+=`<p style="margin:10px 0 0"><b>Exam day. All the best!</b></p>`;
  else h+=`<p class="note" style="margin:10px 0 0">That date has passed. Set your next exam date.</p>`}
 else h+=`<p class="note" style="margin:8px 0 0">Pick your exam date to start the countdown.</p>`;
 return h+`</div>`}
function clean(n){return String(n||"").replace(/[^\w .-]/g,"").trim().slice(0,20)}
function setName(){me.name=clean($("nm").value);save();render()}
function code(){const s=stats(me);return btoa(unescape(encodeURIComponent(JSON.stringify({n:me.name||"Friend",pct:s.pct,mk:s.mk,t:back(0),d:Array.from({length:30},(_,i)=>+((s.days[back(i)]||0).toFixed(2)))}))))}
function frStats(f){if(!f.d)return{wk:f.wk||0,st:f.st||0,pct:f.pct,mk:f.mk};
 const off=Math.max(0,Math.round((new Date(back(0)+"T00:00")-new Date(f.t+"T00:00"))/864e5))||0;
 let wk=0;for(let i=0;i<7;i++){const j=i-off;if(j>=0&&j<30)wk+=f.d[j]||0}
 let st=0,j=f.d[0]?0:1;while(j<30&&f.d[j]>0){st++;j++}

const EXAM_BANK=[{"id":"1.1","set":"A","stem":"Whether the proposal to appoint Amar as a Small Shareholders’ Director can be adopted?","options":{"a":"The said proposal cannot be adopted as notice for his appointment shall be given by 1000 small shareholders.","b":"The said proposal cannot be adopted as notice for his appointment shall be given by more than 1/10 of total small shareholders and no shareholding of Amar is not in compliance.","c":"The said proposal can be adopted as 1/10th of 500 small shareholders comes to 50 and his holding in Pharma Limited is not necessitated mandatorily.","d":"The said proposal cannot be adopted as no nominal value of Rs. 20,000 shares held by Amar in Pharma Limited."},"answer":"c","explanation":"According to Section 151 of the Companies Act, 2013 read with Rule 7 of the Companies (Appointment and Qualification of Directors) Rules, 2014, A listed company may, upon notice of not less than: (a) one thousand small shareholders; or (b) 1/10th of the total number of such shareholders, whichever is lower, have a small shareholders' director elected by the small shareholders. However, a listed Company may opt to have a director on suo moto representing small shareholders. The term \"small shareholders\" means a shareholder holding shares of nominal value of not more than Rs. 20,000 or such other sum as may be prescribed. According to Rule 7, no holding of shares is necessitated for the proposed person to be appointed as SSD. Proposal to appoint Mr. Amar as a Small Shareholders' Director In the instant case, since 50 small shareholders have proposed to appoint Amar as their representative, the said proposal is valid and can be adopted as 1/10th of 500 small shareholders comes to 50 and also no holding of shares is necessitated for appointment of Mr. Amar as SSD."},{"id":"1.2","set":"A","stem":"If there is no such proposal moved by the small shareholders, can Pharma Limited appoint Small Shareholders' Director on its own?","options":{"a":"No, Pharma Limited cannot appoint a small shareholder director on its own.","b":"Yes, Pharma Limited can suo moto appoint small shareholders' director, even if there is no such proposal moved by the small shareholders.","c":"No, for appointment of small shareholders director, notice must come from atleast 1000 small shareholders.","d":"No, for the appointment of small shareholders director, notice must come from 1/10 of total small shareholders."},"answer":"b","explanation":"According to Section 151 of the Companies Act, 2013 read with Rule 7 of the Companies (Appointment and Qualification of Directors) Rules, 2014, A listed Company may opt to have a director on suo moto representing small shareholders. Answer Key 2 Question Answer Reasoning No."},{"id":"2.1","set":"A","stem":"What would be the amount of yearly remuneration for FY 2021-22 paid by PCR Ltd. to Mr. Vivek, the managing director who is appointed on 1st June, 2021?","options":{"a":"Rs. 65,50,000","b":"Rs. 60,50,000","c":"Rs. 60,00,000","d":"Rs. 77,00,000"},"answer":"b","explanation":"As per Section 2(78) of the Companies Act, 2013, (the Act) the term \"Remuneration \"means any money or its equivalent given or passed to any person for services rendered by him and includes perquisites as defined under the Income Tax Act, 1961. Further, as per Section 197(13) of the Act, where any indemnification insurance is taken by a Company on behalf of Managing Director or other managerial personnel, the premium therefor paid by the Company shall not form part of the remuneration payable to any such personnel, if that person is proved not to be guilty during the year of insurance coverage. In the light of the provided information in the problem and as per Section 197 read with Schedule V to the Companies Act, 2013, the computation of the amount that would constitute the yearly remuneration of Mr. Vivek in PCR Limited for the FY 2021-2022 will be as under: Sl.No. Particulars In ` (proportionate to 10 months as the MD has taken charge of the post w.e.f. 01.06.2021) 1. Salary 50,00,000 2. Rent Free Accommodation 5,00,000 3. Children Education Allowance 2,50,000 4 Leave Travel Concession Package (not pro- 3,00,000 rated for 2021-22 as per the question) Total yearly remuneration of Mr. Vivek 60,50,000"},{"id":"2.2","set":"A","stem":"If PCR Limited has incurred losses during the financial years 2020-21 and 2021-22 and the effective capital of the company as on 31st March 2021 is in negative, is there any excess remuneration paid to Mr. Vivek and if yes, what would be that excess remuneration?","options":{"a":"Yes, excess remuneration is there of Rs.10,00,000","b":"Yes, excess remuneration is there of Rs. 10,50,000","c":"Yes, excess remuneration is there of Rs. 15,50,000","d":"Yes, excess remuneration is there of Rs. 27,00,000"},"answer":"b","explanation":"Computation of excess Remuneration paid to Mr. Vivek It is provided that the Company has suffered losses during the FY 2020- 2021 and 2021-2022 and the effective capital of the Company as at 31st March, 2021 is in negative. So, as per the Act read with Schedule V, the maximum yearly managerial remuneration payable to Mr. Vivek shall be `60 Lakhs including perquisites. From the above table of computation, the total yearly remuneration of Mr. Vivek is arrived `60,50,000 (pro-rated) and whereas, for the year 2021-2022, Mr. Vivek will be entitled for maximum remuneration payable not exceeding ` 50 lakhs per annum (pro-rated for 10 months). Thus, the excess remuneration paid to Mr. Vivek is Rs. 10,50,000/- [i.e.Rs. 60,50,000 (-) Rs.50,00,000]."},{"id":"2.3","set":"A","stem":"Under what circumstances, PCR Limited can waive the excess remuneration paid to Mr. Vivek (if any)?","options":{"a":"A waiver is approved by an ordinary resolution passed by the company within 1 year from the date the sum becomes refundable.","b":"A waiver is approved by a special resolution passed by the company within 1 year from the date the sum becomes refundable.","c":"A Waiver is approved by an ordinary resolution passed by the company within 2 years from the date the sum becomes refundable.","d":"A Waiver is approved by a special resolution passed by the company within 2 years from the date the sum becomes refundable."},"answer":"d","explanation":"As per Sections 197(9) and 197(10) of the Companies Act, 2013, where the remuneration received by any director is in excess of the limit it shall be refunded to the Company by such director and till that time he holds it in trust for the Company. The Company shall not waive the recovery of any sum which is refundable to it unless the waiver is approved by a Special Resolution passed by the Company within two years from the date the sum becomes refundable. Answer Key 3 Question Answer Reasoning No."},{"id":"3.1","set":"A","stem":"In case of oppression and mismanagement, how many members can apply to the Tribunal:","options":{"a":"Not less than 100 members are required to file an application with the Tribunal.","b":"Not less than one-tenth of the total number of members i.e. 50 members (500/10= 50) are required to file an application with the Tribunal","c":"Not less than 100 members of the company or not less than one-tenth of the total number of its members, whichever is less. i.e. 50 members are required to file an application with the Tribunal.","d":"Not less than 100 members of the company or not less than one-tenth of the total number of its members, whichever is higher i.e. 100 members are required to file an application with the Tribunal."},"answer":"c","explanation":"As per section 244 of the Companies Act, 2013- (1) provides that the following members of a company shall have the right to apply under section 241, namely:— (a) in the case of a company having a share capital, not less than one hundred members of the company or not less than one-tenth of the total number of its members, whichever is less, or any member or members holding not less than one tenth of the issued share capital of the company, subject to the condition that the applicant or applicants has or have paid all calls and other sums due on his or their shares."},{"id":"3.2","set":"A","stem":"On what grounds the application of Dharmesh was accepted by the Tribunal:","options":{"a":"Dharmesh is one of the shareholder of the Company.","b":"Dharmesh is having the majority of shares in the company.","c":"Dharmesh is having more than one-tenth share in the share capital of the company.","d":"Dharmesh is Member of Parliament."},"answer":"c","explanation":"Again coming to section 244(1) which provides that- The following members of a company shall have the right to apply under section 241, namely:— (a) in the case of a company having a share capital, not less than one hundred members of the company or not less than one-tenth of the total number of its members, whichever is less, or any member or members holding not less than one tenth of the issued share capital of the company, subject to the condition that the applicant or applicants has or have paid all calls and other sums due on his or their shares. Here, Dharmesh alone is having more than one-tenth share capital i.e. 2 lakh shares of having the face value of Rs 20 lakh, hence he is eligible to apply to the Tribunal."},{"id":"3.3","set":"A","stem":"Whether Tribunal have powers to remove the Managing Director, who was appointed by the Board and the shareholders in the General Meeting:","options":{"a":"No, Tribunal do not have the powers to remove any official.","b":"The Tribunal can only order for the winding up of the company if it is just and equitable for the company.","c":"The Tribunal may after observing the mal-practices of the MD, can ask not to repeat it.","d":"The Tribunal can terminate the service agreement arrived at between the company and the MD."},"answer":"d","explanation":"Section 242(2) provides that – (2) Without prejudice to the generality of the powers under sub-section (1), an order under that sub-section may provide for— (e) the termination, setting aside or modification, of any agreement, howsoever arrived at, between the company and the managing director, any other director or manager, upon such terms and conditions as may, in the opinion of the Tribunal, be just and equitable in the circumstances of the case; (f) the termination, setting aside or modification of any agreement between the company and any person other than those referred to in clause (e): Provided that no such agreement shall be terminated, set aside or modified except after due notice and after obtaining the consent of the party concerned."},{"id":"3.4","set":"A","stem":"Whether Gyan Singh, the Managing Director can demand compensation from the company from the date of removal to the remaining period:","options":{"a":"The MD can demand the compensation from the date of removal to the remaining period.","b":"The MD can be relieved by notice with three month’s salary.","c":"The MD can be relieved by notice with one month’s salary.","d":"The MD cannot demand any compensation for loss of office."},"answer":"d","explanation":"Section 243 (1) provides that- Where an order made under section 242 terminates, sets aside or modifies an agreement such as is referred to in sub-section (2) of that section,— (a) such order shall not give rise to any claims whatever against the company by any person for damages or for compensation for loss of office or in any other respect either in pursuance of the agreement or otherwise."},{"id":"3.5","set":"A","stem":"Whether Gyan Singh after being terminated from this company, can apply to any other company for the post of director or any other office:","options":{"a":"After termination from this company, Gyan Singh can apply to any other company for the post of director or any other office.","b":"After termination from this company, Gyan Singh cannot apply to any other company for the post of director or any other office, a period of one year.","c":"After termination from this company, Gyan Singh cannot apply to any other company for the post of director or any other office, a period of three years.","d":"After termination from this company, Gyan Singh cannot apply to any other company for the post of director or any other office, a period of five years."},"answer":"d","explanation":"Section 243 (1A) provides that the person who is not a fit and proper person pursuant to sub-section (4A) of section 242 shall not hold the office of a director or any other office connected with the conduct and management of the affairs of any company for a period of five years from the date of the said decision. Section 242(4A) provides that at the conclusion of the hearing of the case in respect of sub-section (3) of section 241, the Tribunal shall record its decision stating therein specifically as to whether or not the respondent is a fit and proper person to hold the office of director or any other office connected with the conduct and management of any company. Answer Key 4 Question Answer Reasoning No."},{"id":"4.1","set":"A","stem":"Raman, who had invested substantially in LSL, was informed that only copies of the written Memorandum setting out the terms and conditions of the service could be provided for inspection as no written Service Contracts with Arjun (Managing Director) as well as Ramesh and Ripudaman (Whole-time Directors) were available. Raman was not convinced and thought it to be a fraudulent practice for which the company and every defaulting officer of the company must be punished. In the light of the requirement of the relevant legal provisions under the given circumstances, choose the most appropriate remedy available to Raman as per the Companies Act, 2013:","options":{"a":"Raman can hold liable to the Company and its every officer who is in default, for non- production of Written Service Contracts for inspection.","b":"Raman finds that availability of only copies of the written Memorandum setting out the terms and conditions of the service, for inspection, is in order.","c":"Raman have remedy only against Arjun, Ramesh and Ripudaman, for non-production of Service Contracts for inspection.","d":"Raman have no remedy, as to production of Service Contracts for inspection, as it is not necessitated."},"answer":"b","explanation":"(b) It shall be in order, if the Company provides copies of the written Memorandum setting out the terms and conditions of the services for inspection. Reason – Section 190 (1) Every company shall keep at its registered office a contract of service with a managing or whole-time director is in writing, a copy of the contract; and where such a contract is not in writing, a written memorandum setting out its terms. It is worth noting that the copies of the contract or the memorandum kept under sub-section (1) shall be open to inspection by any member of the company without payment of fee."},{"id":"4.2","set":"A","stem":"According to Mahadevan, whole-time Company Secretary, SCPL was an undertaking of LSL. If the Board of Directors of LSL decided to dispose of its investment in SCPL, considering SCPL as an undertaking of LSL, which of the following options shall be applicable:","options":{"a":"The Board of Directors of LSL shall exercise the power of disposing of its investment in SCPL, considering SCPL as an undertaking of LSL, by means of a Board Resolution assented to by all the Directors present at a duly convened Board Meeting.","b":"The Board of Directors of LSL shall exercise the power of disposing of its investment in SCPL, considering SCPL as an undertaking of LSL, only with the consent of the company by an Ordinary Resolution.","c":"The Board of Directors of LSL shall exercise the power of disposing of its investment in SCPL, considering SCPL as an undertaking of LSL, only with the consent of the company by a Special Resolution and thereafter, by seeking approval of the jurisdictional Registrar of Companies.","d":"The Board of Directors of LSL shall exercise the power of disposing of its investment in SCPL, considering SCPL as an undertaking of LSL, only with the consent of the company by a Special Resolution."},"answer":"d","explanation":"The Board of Directors of SL shall exercise the power of disposing of its investment in SCPL, considering SCPL as an undertaking of LSL, only with the consent of the company by a Special Resolution. Reason – Section 180(1)(a) The Board of Directors of a company shall exercise the powers to sell, lease or otherwise dispose of the whole or substantially the whole of the undertaking of the company or where the company owns more than one undertaking, of the whole or substantially the whole of any of such undertakings only with the consent of the company by a special resolution. 4.3 ((a) (a) The decision of the Board is correct because no act done by a person as a Director shall be deemed to be invalid if it was subsequently noticed that his appointment was invalid by reason of any defect or disqualification, etc. Reason – Section 176 No act done by a person as a director shall be deemed to be invalid, notwithstanding that it was subsequently noticed that his appointment was invalid by reason of any defect or disqualification or had terminated by virtue of any provision contained in this Act or in the articles of the company."},{"id":"4.3","set":"A","stem":"According to the case scenario, the Board of Directors of LSL stated that since January, 2020 Raghuram had participated in several Board Meetings and assented to various decisions, which had both pecuniary and operational impact. In addition, the Board had passed several resolutions during that period. Accordingly, the Board, in one of its meetings, decided by passing a resolution that the wrongfully appointed Director, Raghuram shall make good the losses, if any, over the period he remained Executive Director and all the resolutions passed during his period and assented to by him shall be valid and stand good. Specify which amongst the following decision taken by the Board is valid as per the requirement of the Companies Act, 2013:","options":{"a":"The decision of the Board is correct because no act done by a person as a Director shall be deemed to be invalid if it was subsequently noticed that his appointment was invalid by reason of any defect or disqualification, etc.","b":"The Board is required to get all the resolutions passed during the tenure of Raghuram and assented by him, ratified by an Ordinary Resolution at a General Meeting of the shareholders.","c":"The Board is required to get all the resolutions passed during the tenure of Raghuram and assented by him, ratified by a Special Resolution passed at a General Meeting of the shareholders.","d":"The Board is required to cancel all the resolutions passed during the tenure of Raghuram and assented by him since they were void and inoperative ab-initio."}},{"id":"4.4","set":"A","stem":"The case scenario states that LSL, after complying with the required legal formalities, made some political contributions and incurred some expenses during the financial year 2022-23. LSL showed in its financial statements Rs.11,00,000 as political contributions and Rs.3,00,000 as ‘Advertisement and Business Promotion Expenses’. From the following options choose the correct statement as regards the disclosure of political contribution :","options":{"a":"The disclosure made by LSL in its financial statements showing Rs. 11,00,000 as political contributions and Rs. 3,00,000 as ‘Advertisement and Business Promotion Expenses’ is correct.","b":"LSL was required to disclose Rs. 10,00,000 as political contributions and Rs. 4,00,000 as ‘Advertisement and Business Promotion Expenses’.","c":"LSL was required to disclose all the sums totaling Rs. 14,00,000 as political contributions.","d":"LSL was required to disclose Rs.12,00,000 as political contributions and Rs. 2,00,000 as ‘Advertisement and Business Promotion Expenses’."},"answer":"c","explanation":"SL was required to disclose all the sums totaling Rs. 14,00,000 as political contributions. Reason – Section 182 (2) Political Contribution shall include a donation or subscription or payment caused to be given by a company on its behalf or on its account to a person who, to its knowledge, is carrying on any activity which, at the time at which such donation or subscription or payment was given or made, can reasonably be regarded as likely to affect public support for a political party shall also be deemed to be contribution of the amount of such donation, subscription or payment to such person for a political purpose; or/and The amount of expenditure incurred, directly or indirectly, by a company on an advertisement in any publication, being a publication in the nature of a souvenir, brochure, tract, pamphlet or the like, shall also be deemed, where such publication is by or on behalf of a political party, and where such publication is not by or on behalf of, but for the advantage of a political party."},{"id":"4.5","set":"A","stem":"Ramesh, the Whole-time Director of LSL, was not an interested party at the time of entering into this Supply Contract with ASPL. However, during the second year of the Supply Contract, Rajesh, (son of Ramesh) purchased about 30% of the equity shares of ASPL through one of his family owned business entities and also lent Rs.25 lakh as unsecured loan to ASPL. Then also Ramesh did not inform LSL or the Board of Directors regarding the new developments since he was of the opinion that there was no need for such disclosure. Comment upon the validity of the statement as to the non- disclosure of interest of Ramesh in compliance with the Companies Act, 2013:","options":{"a":"Ramesh opinion is correct stating that there is no need for such disclosure of the interest of his son, Rajesh, as compliance is only w.r.t the director of the company.","b":"Ramesh need to disclose as he is indirectly (due to his shareholding and granting of loan by his son) concerned in a Supply Contract with ASPL at the meeting of the Board in which the contract or arrangement is discussed forthwith when he becomes concerned or interested. Statement of Ramesh as to non-disclosure is invalid.","c":"Ramesh was not interested or concerned in a Supply Contract with ASPL at the time of entering into this Supply Contract. A non –disclosure of interest by him is the valid statement.","d":"As Rajesh is the concerned or interested person in the Supply Contract to ASPL, being a shareholder of ASPL and also indebted Rs.25 lakh as unsecured loan to ASPL. A non -disclosure of interest is the invalid statement."},"answer":"a","explanation":"Ramesh opinion is correct stating that there is no need for such disclosure of the interest of his son, Rajesh, as compliance is only w.r.t the director of the company. Reason: As per section 184 of the Companies Act, every director of a company who is in any way, whether directly or indirectly, concerned or interested in a contract or arrangement or proposed contract or arrangement entered into or to be entered into— (a) with a body corporate in which such director or such director in association with any other director, holds more than two per cent shareholding of that body corporate, or is a promoter, manager, Chief Executive Officer of that body corporate; or (b) with a firm or other entity in which, such director is a partner, owner or member, as the case may be, shall disclose the nature of his concern or interest at the meeting of the Board in which the contract or arrangement is discussed and shall not participate in such meeting. Answer Key 5 Question Answer Reasoning No."},{"id":"5.1","set":"A","stem":"From the case scenario, it is observed that PQR Traders Private Limited has applied for becoming a member of Paavan Nidhi Limited. From the following options, choose the one which is applicable in such a situation:","options":{"a":"PQR Traders Private Limited cannot become a member of Paavan Nidhi Limited.","b":"PQR Traders Private Limited can become a member of Paavan Nidhi Limited by investing minimum ` 5,00,000 as capital.","c":"PQR Traders Private Limited can become a member of Paavan Nidhi Limited by including a clause in its Articles of Association which permits it to become a member of a Nidhi company.","d":"PQR Traders Private Limited must be in existence for a minimum period of three years to be eligible for becoming member of a Nidhi company."},"answer":"a","explanation":"PQR Traders Private Limited cannot become a member of Paavan Nidhi Limited. Reason – Rule 8 (1) of Nidhi Rules 2014 A Nidhi shall not admit a body corporate or trust as a member. Therefore PQR Traders Private Limited (being body corporate) cannot become a member of Paavan Nidhi Limited. 5.2 (b ) (b) Paavan Nidhi Limited may accept deposit in the name of Rudra, a minor, since it is made by Mr. Kshitij, a member and the father of Rudra but being minor, he cannot be made a member. Reason – Rule 8 (3) of Nidhi Rules 2014 A minor shall not be admitted as a member of Nidhi. Further proviso to said rule suggests that deposits may be accepted in the name of a minor, if they are made by the natural or legal guardian who is a member of Nidhi. 5.3 Padam shall be eligible for re-appointment only after the expiry of two years (a) of ceasing to be a Director. Reason - Rule 17 (3) of Nidhi Rules 2014 The Director of Nidhi shall be eligible for re-appointment only after the expiration of two years of ceasing to be a Director. 5.4 M/s A & A Associates can be re-appointed as auditors for another term of (b) five years since a Nidhi company is permitted to appoint or reappoint any auditing firm for two terms of five consecutive years. Reason - Rule 19 (2) of Nidhi Rules 2014 No Nidhi shall appoint or re-appoint an audit firm as auditor for more than two terms of five consecutive years. It is worth noting that an auditor (whether an individual or an audit firm) shall be eligible for subsequent appointment after the expiration of two years from the completion of his or its term."},{"id":"5.2","set":"A","stem":"Piyush, one of the Directors of Paavan Nidhi Limited has raised objection on acceptance of deposit amounting to ` 1,00,000 in the name of Rudra, a minor, and negotiations initiated by his father Mr. Kshitij to make him a member of the Paavan Nidhi. From the following options choose the one which is applicable in the given situation:","options":{"a":"Paavan Nidhi Limited can neither accept deposit in the name of Rudra, a minor, nor can make him a member.","b":"Paavan Nidhi Limited may accept deposit in the name of Rudra, a minor, since it is made by Mr. Kshitij, a member and the father of Rudra but being minor, he cannot be made a member.","c":"Paavan Nidhi Limited cannot accept deposit in the name of Rudra exceeding ` 25,000 but he can become a member by contributing minimum amount.","d":"Paavan Nidhi Limited can accept deposit in the name of Rudra up to ` 2,00,000 and he can become a member of the company."}},{"id":"5.3","set":"A","stem":"From the case scenario, it is evident that Padam, the senior-most Director, has been honoured by Paavan Nidhi Limited to hold Directorship for a term up to ten consecutive years. After relinquishing his office as Director at the expiry of ten years, when can Padam be re-appointed as Director of the company.","options":{"a":"Padam shall be eligible for re-appointment only after the expiry of two years of ceasing to be a Director.","b":"Padam shall be eligible for re-appointment only after the expiry of one year of ceasing to be a Director.","c":"Padam shall be eligible for re-appointment only after the expiry of six months of ceasing to be a Director.","d":"Padam shall not be eligible for re-appointment once he ceases to be a Director."}},{"id":"5.4","set":"A","stem":"If M/s A & A Associates, a firm of auditors, has been appointed as auditors of Paavan Nidhi Limited for a term of five years commencing from FY 2016-17 to FY 2020-21 and if the company is desirous of re-appointing the said firm of auditors for another term of five years commencing from FY 2021-22, then which of the following options is applicable in such an eventuality:","options":{"a":"M/s A & A Associates cannot be re-appointed as auditors for another term of five years since no Nidhi company shall appoint or reappoint any auditing firm for two terms of five consecutive years.","b":"M/s A & A Associates can be re-appointed as auditors for another term of five years since a Nidhi company is permitted to appoint or reappoint any auditing firm for two terms of five consecutive years.","c":"M/s A & A Associates cannot be re-appointed as auditors for another term of five years since no Nidhi company is permitted to re-appoint any auditing firm before the expiry of two years if an auditing firm ceases to be its auditors after completion of the term of five years.","d":"M/s A & A Associates cannot be re-appointed as auditors for another term of five years since no Nidhi company is permitted to re-appoint any auditing firm before the expiry of one year if an auditing firm ceases to be its auditors after completion of the term of five years."}},{"id":"5.5","set":"A","stem":"The rate of interest charged on loan given by Nidhi can be;","options":{"a":"Five per cent above the highest rate of interest offered on deposits by Nidhi and shall be calculated on reducing balance method","b":"Five per cent above the highest rate of interest offered on deposits by Nidhi and shall be calculated on as flat rate basis","c":"Seven and half per cent above the highest rate of interest offered on deposits by Nidhi and shall be calculated on reducing balance method","d":"Seven and half per cent above the highest rate of interest offered on deposits by Nidhi and shall be calculated on as flat rate basis"},"answer":"c","explanation":"Seven and half per cent above the highest rate of interest offered on deposits by Nidhi and shall be calculated on reducing balance method. Reason - Rule 16 of Nidhi Rules 2014 The rate of interest to be charged on any loan given by a Nidhi shall not exceed seven and half per cent above the highest rate of interest offered on deposits by Nidhi and shall be calculated on reducing balance method. Answer keys 6 Question Answer Reasoning No."},{"id":"6.1","set":"A","stem":"From the case scenario, it is observed that the share of the Central Government in the paid-up share capital of GECL is 21% while the State Government of Gujarat and Navyug Engineering Limited, a government company, respectively hold 23% and 10% of its paid-up capital. Which one of the following options is applicable in such a situation:","options":{"a":"GECL is a Government Company since both the Central Government and the State Government of Gujarat hold more than 25% of its paid-up share capital.","b":"GECL is not a Government Company since the Central Government, the State Government of Gujarat and Navyug Engineering Limited, a Government Company, hold only 54% of its paid-up share capital which is less than the threshold limit of 55%.","c":"GECL is a Government Company since the Central Government, the State Government of Gujarat and Navyug Engineering Limited, a Government Company, hold 54% of its paid-up share capital which is more than the threshold limit of 51%.","d":"GECL is not a Government Company since the Central Government and the State Government of Gujarat together hold 44% of its paid-up share capital which is less than the threshold limit of 51%."},"answer":"d","explanation":"GECL is not a Government Company since the Central Government and the State Government of Gujarat together hold 44% of its paid-up share capital which is less than the threshold limit of 51%. Reason - Section 2(45) of the Companies Act, 2013 Government company means any company in which not less than fifty- one percent of the paid-up share capital is held by the  Central Government, or  Any State Government or Governments, or  Partly by the Central Government and partly by one or more State Governments, and Includes a company which is a subsidiary company of such a Government company. Since Union Government (21%) and Government of Gujarat (23%) together hold only 44% of paid-up share capital, which less than 51%; hence not a government company."},{"id":"6.2","set":"A","stem":"Which one of the following options is applicable in case Mr. Anant was preferred to be given the valuation assignment of valuing the assets of GECL.","options":{"a":"Mr. Anant cannot act as a valuer being a person not resident in India.","b":"Mr. Anant cannot act as a valuer since process of valuation of goodwill is a tedious and time-consuming task.","c":"Mr. Anant can act as a valuer being a valuer member of a registered valuers’ organisation in London and is more knowledgeable than others.","d":"Mr. Anant can act as a valuer being a valuer member of a registered valuers’ organisation in London and is out of India for less than seven years."},"answer":"a","explanation":"Mr. Anant cannot act as a valuer being a person not resident in India. Reason – Rule 3(1)(h) of Companies (Registered Valuers and Valuation) Rules, 2017 A person shall be eligible to be a registered valuer if he is a person resident in India. It is worth noting that for the purposes of these rules ‘person resident in India’ shall have the same meaning as defined in clause (v) of section 2 of the Foreign Exchange Management Act, 1999 (42 of 1999) as far as it is applicable to an individual;"},{"id":"6.3","set":"A","stem":"In case PML is aggrieved by the order dated 30-10-2021 of the Registrar of Companies that led to the removal of its name from the Register of Companies and its dissolution and therefore, it desires to file an appeal to the National Company Law Tribunal (NCLT), which one of the following options shall be applicable in such a situation:","options":{"a":"PML is permitted to file an appeal to the National Company Law Tribunal (NCLT) within a period of one year from the date of the order of the Registrar of Companies.","b":"PML is permitted to file an appeal to the National Company Law Tribunal (NCLT) within a period of two years from the date of the order of the Registrar of Companies.","c":"PML is permitted to file an appeal to the National Company Law Tribunal (NCLT) within a period of three years from the date of the order of the Registrar of Companies.","d":"PML is permitted to file an appeal to the National Company Law Tribunal (NCLT) within a period of five years from the date of the order of the Registrar of Companies."},"answer":"c","explanation":"PML is permitted to file an appeal to the National Company Law Tribunal (NCLT) within a period of three years from the date of the order of the Registrar of Companies. Reason – Section 252(1) Any person aggrieved by an order of the Registrar, notifying a company as dissolved under section 248, may file an appeal to the Tribunal within a period of three years from the date of the order of the Registrar Answer keys 7 Question Answer Reasoning No."},{"id":"7.1","set":"A","stem":"Can ABC Limited terminate Mr. Atul, an employee of the company, if no reply is received from the Tribunal?","options":{"a":"No, the termination of Mr. Atul is not valid, and company has attracted penal provisions under the Law.","b":"No, the termination of Mr. Atul is not valid because the company cannot consider the non-reply of the Tribunal as deemed approval.","c":"Yes, the termination of Mr. Atul made by the company is totally valid in law and the company can do so by considering deemed approval of tribunal.","d":"Yes, the termination of Mr. Atul made by the company is totally valid in law as filing an application to the Tribunal is not required in this case and the company on its own can terminate Mr. Atul."},"answer":"c","explanation":"The provision of Section 218 states that, the company shall require to take approval of the tribunal before taking action against the employee if there is any pendency of any proceedings against any person concerned in the conduct and management of the affairs of the company. The company shall require approval in the following circumstances: discharge or suspension of an employee; or punishment to an employee by dismissal, removal, reduction in rank or otherwise; or change in the terms of employment to the disadvantage of employee(s); The Tribunal shall notify its objection to the action proposed in writing. In case, the company, other body corporate or person concerned does not receive the approval of the Tribunal within 30 days of making the application, it may proceed to take the action proposed against the employee. That means it can be considered as a deemed approval by the tribunal."},{"id":"7.2","set":"A","stem":"Regarding termination of employment of Mr. Atul by ABC Limited, what is the remedy available with Mr. Atul?","options":{"a":"Mr. Atul can file an appeal to the Appellate Tribunal within 30 days of his termination.","b":"Mr. Atul can file an appeal to the Appellate Tribunal within 45 days of his termination.","c":"Mr. Atul can file an appeal to the Court having jurisdiction within 30 days of his termination.","d":"Mr. Atul has no remedy available to him. Section B: Securities Laws"},"answer":"d","explanation":"Mr. Atul has not any remedy available. As per the provision of the law, appeal to the appellate tribunal can be made only if the person is dissatisfied with the objection raised by the tribunal. Hence, in this case the tribunal has not replied Mr. Atul cannot refer to an appeal to Appellate Tribunal. Answer keys 8 Question Answer Reasoning No."},{"id":"8.2","set":"A","stem":"Ascertain how many complaints redressed during the relevant quarter of the financial year 2022-2023 as per the requirements of the mentioned quarter in above question -","options":{"a":"10","b":"20","c":"27","d":"57"},"answer":"d","explanation":"No. of Complaints redressed during the 4 quarter of the Financial year 2022- 2023 is 57. Answer Key 9 Question No. Answer Reasoning"},{"id":"9.1","set":"A","stem":"In regards to intent of Fire Limited which is listed issuer, to proceed with composite issue of specified securities. Advise Mr. Bhavesh and Mr. Alok what type of issue or placement can be composed together.","options":{"a":"Public cum private placement","b":"Public cum right allotment","c":"Bonus cum right allotment","d":"Public cum preferential allotment"},"answer":"b","explanation":"Clause (h) to regulation 2(1) of the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018 “composite issue” means an issue of specified securities by a listed issuer on public-cum-rights basis, wherein the allotment in both public issue and rights issue is proposed to be made simultaneously. 9..2 (d) Regulation 5(1) of the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018 An issuer shall not be eligible to make an initial public offer 1. If the issuer, any of its promoters, promoter group or directors or selling shareholders are debarred from accessing the capital market by the Board. 2. If any of the promoters or directors of the issuer is a promoter or director of any other company which is debarred from accessing the capital market by the Board 3. If the issuer or any of its promoters or directors is a wilful defaulter or a fraudulent borrower. 4. If any of its promoters or directors is a fugitive economic offender."},{"id":"9.2","set":"A","stem":"Which of the following options is representing the correct set of reasons or disqualifications due to which Pawan Limited become ineligible to make an initial public offer? i. if the issuer or any of its promoters or directors is a wilful defaulter or a fraudulent borrower. ii. if the issuer, any of its promoters, promoter group or directors or selling shareholders are debarred from accessing the capital market by the SEBI. iii. if any of the promoters or directors of the issuer is a promoter or director of any other company which is debarred from accessing the capital market by the SEBI.","options":{"a":"i and ii only","b":"ii only","c":"ii and iii only","d":"All of i, ii, and iii"}},{"id":"9.3","set":"A","stem":"Regarding the revision made by Fire Limited in the price band, it shall extend the bidding (issue) period disclosed in the red herring prospectus for;","options":{"a":"A minimum period of five working days","b":"A minimum period of three working days","c":"A minimum period of two working days","d":"No extension is required"},"answer":"b","explanation":"Regulation 46(2) of the Securities and Exchange Board of India (Issue of Capital and Disclosure Requirements) Regulations, 2018 Regulation 46 deals with period of subscription Sub-regulation 2 provides in case of a revision in the price band, the issuer shall extend the bidding (issue) period disclosed in the red herring prospectus, for a minimum period of three working days, subject to the provisions of sub- regulation (1). Here it is important to note that sub-regulation 1 provides except as otherwise provided in these regulations, an initial public offer shall be kept open for at least three working days and not more than ten working days. Answer Key 10 Question Answer Reasoning No."},{"id":"10.2","set":"A","stem":"Whether constitution of Audit Committee is in order in case of Venus Limited?","options":{"a":"No, because Audit Committee shall consist of at least 3 directors with independent directors forming a majority.","b":"No, because Audit Committee shall consist of at least 3 directors out of which at least 2/3 shall be independent directors.","c":"Yes, because Audit Committee shall consist of at least 3 directors out of which at least 1/3 shall be independent directors.","d":"Yes, because Audit Committee shall consist of at least 3 directors with at-least 2 independent directors and/or non-executive directors."},"answer":"b","explanation":"No, because audit committee shall consist of at least 3 directors out of which 2/3 shall be independent directors. Reason – Regulation 18(1) of the Securities and Exchange Board of India (Listing Obligation and Disclosure Requirements) Regulations, 2015 Every listed entity shall constitute a qualified and independent audit committee in accordance with the terms of reference, subject to the following The audit committee shall have minimum three directors as members. At least two-thirds of the members of audit committee shall be independent directors While in given case 3 out of 6 audit committee members are independent directors that amounts to ½ only, whereas requirement is of at least 2/3rd."},{"id":"10.3","set":"A","stem":"Which of following is the correct option that represents those meetings of audit committee convened during 2022-23, which was supposed to be adjourned for want of quorum?","options":{"a":"Only 7th meeting.","b":"5th and 7th meetings only.","c":"3rd, 5th and 7th meeting only.","d":"None of the meeting."},"answer":"b","explanation":"Regulation 18(2)(b) of the Securities and Exchange Board of India (Listing Obligation and Disclosure Requirements) Regulations, 2015 The quorum for audit committee meeting shall either be two members or one third of the members of the audit committee, whichever is greater, with at least two independent directors. In case of both 5th and 7th two independent directors were not present, hence these two meetings was supposed to be adjourned for want of quorum."},{"id":"10.4","set":"A","stem":"How many instances of default by Venus Limited in context to number of meetings of audit committee and time gap between such meetings took place during 2021-22 and 2022-23;","options":{"a":"Not even once in both the years","b":"Once each during 2021-22 and 2022-23","c":"Once only in 2021-22","d":"Once only in 2022-23"},"answer":"d","explanation":"Regulation 18(2)(a) of the Securities and Exchange Board of India (Listing Obligation and Disclosure Requirements) Regulations, 2015 The audit committee shall meet at least four times in a year and not more than one hundred and twenty days shall elapse between two meetings. The time gap between 3th (8th July 2022) and 4th meeting (11th Nov 2022) is more than 120 days."},{"id":"10.5","set":"A","stem":"Financial results of first quarter of 2023-24 need to be reported to stock exchange by Venus Limited within;","options":{"a":"15th July, 2023","b":"30th July, 2023","c":"14th August, 2023","d":"29th August, 2023 Section C: Economic Laws (30 Marks)"},"answer":"c","explanation":"Regulation 33(3)(a) of the Securities and Exchange Board of India (Listing Obligation and Disclosure Requirements) Regulations, 2015 The listed entity shall submit quarterly and year-to-date standalone financial results to the stock exchange within forty-five days of end of each quarter, other than the last quarter. Forty five days from end of first quarter i.e. 30th June 2023 last on 14th August 2023. Answer Key 11 Question Answer Reasoning No."},{"id":"11.1","set":"A","stem":"Whether import of Indian currency of Rs. 20,000 in the denomination of Rs. 200 from London by Mr. Raman is permissible under the provisions of FEMA?","options":{"a":"lmport of currency notes of Government of India and RBI notes of Rs. 20,000 is not permissible as it exceeds the limit of Rs. 10,000, denomination of currency is immaterial.","b":"lmport of currency notes of Government of India and RBI notes of Rs. 20,000 is permissible as it does not exceeds the limit of Rs. 25000, denomination of currency is immaterial.","c":"lmport of currency notes of government of India and RBI notes of Rs. 20,000 is not permissible as import of Indian currency can be done of denomination only upto Rs. 100.","d":"lmport of currency notes of government of India and RBI notes of Rs. 20,000 is not permissible as no import of Indian currency is allowed as per Regulations."},"answer":"b","explanation":"As per Regulations related to Import of goods and services under FEMA: Any person resident in India who had gone out of India on a temporary visit, may bring into India at the time of his return from any place outside India (other than from Nepal and Bhutan), currency notes of Government of India and Reserve Bank of India notes up to an amount not exceeding ` 25,000 (Rupees Twenty Five Thousand only)."},{"id":"11.2","set":"A","stem":"Whether import of Indian currency of Rs. 1,00,000 in the denomination of Rs. 500 from Bhutan by Mr. Raman is prohibited under the provisions of FEMA?","options":{"a":"lmport of currency notes of government of India and RBI notes of Rs. 1,00,000 is not prohibited as there is no ceiling limit as per Regulations","b":"lmport of currency notes of government of India and RBI notes of Rs. 1,00,000 is prohibited as import of Indian currency can be done of denomination only upto Rs. 100.","c":"lmport of currency notes of government of India and RBI notes of Rs. 1,00,000 is not prohibited as denomination of currency is immaterial.","d":"lmport of currency notes of government of India and RBI notes from Bhutan is prohibited."},"answer":"b","explanation":"As per Regulations related to Import of goods and services under FEMA, A person may bring into India from Nepal or Bhutan, currency notes of Government of India and Reserve Bank of India for any amount in denominations up to ` 100/- without any ceiling. Answer Key 12 Question Answer Reasoning No."},{"id":"12.1","set":"A","stem":"Whether the donation made by Mr. Murugan is a Foreign Source?","options":{"a":"No, as Mr. Murugan is a person of Indian Origin, the donation made by him is not a foreign source.","b":"No, as Mr. Murugan is an overseas citizen of India cardholders, the donation made by him is not a foreign source.","c":"No, as he has donated his personal savings, it is not a foreign source.","d":"Yes, Donation from Mr. Murugan, a Person of Indian origin who has acquired American citizenship and also is an Overseas Citizen of India cardholder, will be treated as foreign contribution."},"answer":"d","explanation":"Foreign Contribution is defined under Section 2(1)(h) of the Foreign Contribution (Regulation) Act, 2010 (FCRA, 2010), to mean the donation, delivery or transfer made by any foreign source. Section 2(1)(j) only speaks about citizen of a foreign country while inclusively defining foreign source. A donation, delivery or transfer of any article, currency or foreign security by any person who has received it from any foreign source, either directly or through one or more persons is a foreign contribution. Donation from Mr. Murugan, a Person of Indian origin who has acquired American citizenship and also is an Overseas Citizen of India cardholder, will be treated as foreign contribution."},{"id":"12.2","set":"A","stem":"In case Mr. Murugan still holds Indian Citizenship, state whether the donation made by Mr. Murugan is a Foreign Source?","options":{"a":"The said donation will be treated as foreign contribution as Mr. Murugan is settled in USA and he is a foreigner.","b":"The said donation will not be treated as foreign contribution as Mr. Murugan holds Indian citizenship and he is not a foreigner.","c":"The said donation will be treated as a foreign contribution as Mr. Murugan has donated from his personal savings earned in USA.","d":"The said donation will be treated as a foreign contribution as it is received from any country other than India."},"answer":"b","explanation":"Contributions made by a citizen of India living in another country i.e. 'Non-resident Indians' from his personal savings through normal banking channels is not to be treated as foreign contribution. In case if Mr. Murugan holds Indian citizenship, he is not a foreigner and therefore, donation given by Mr. Murugan, will not be treated as foreign contribution. Answer Key 13 Question Answer Reasoning No."},{"id":"13.1","set":"A","stem":"In regard to remittance of an amount equivalent to USD 81,800 (USD 64,000 in 2021-22 and USD 17,800 in 2022-23) against the tuition fee of only USD 27,500 (including all), by father of Mr. Manish in foreign currency to his son (Mr. Manish), identify the correct option as per applicable law;","options":{"a":"Violate the permissible limit during 2021-22","b":"Violate the permissible limit during 2022-23","c":"Violation in both the years 2021-22 as well as 2022-23","d":"There is no violation, neither in 2021-22 nor 2022-23"},"answer":"d","explanation":"As per item number viii in part 1 to schedule III of Foreign Exchange Management (Current Account Transactions) Rules 2000 individual can avail foreign exchange facility within a limit of USD 250000 without prior approval of RBI for the purpose of studies abroad. It is worth noting that the Liberalised Remittance scheme, allow remittance more than UDS 250000 for the purpose of study abroad (if fee of such academic institute is higher than threshold of USD 250,000). Since in none of the years, the amount of remittance above the threshold, hence provisions not violated."},{"id":"13.2","set":"A","stem":"Regarding the realisation of proceed of Development Program Conducted in UAE the proceed of export of services (professional development program), in view of the changed economic scenario in the country, Vasuki, one of the Executive Directors of PISCO Electronics, requested the company for change in his borrowing terms i.e. to reduce the interest rate to 8% per annum from the existing 9% per annum and to increase the period of repayment from the present 20 instalments to 30 instalments. Which of the following options is applicable in such a situation:","options":{"a":"The amount representing the full export value of services exported shall be realised within six months or within such period as may be specified by the Reserve Bank, in consultation with the Government, from time to time, from the date of export.","b":"The amount representing the full export value of services exported shall be realised and repatriated to India within six months or within such period as may be specified by the Reserve Bank, in consultation with the Government, from time to time, from the date of export.","c":"The amount representing the full export value of services exported shall be realised within nine months or within such period as may be specified by the Reserve Bank, in consultation with the Government, from time to time, from the date of export.","d":"The amount representing the full export value of services exported shall be realised and repatriated to India within nine months or within such period as may be specified by the Reserve Bank, in consultation with the Government, from time to time, from the date of export."},"answer":"d","explanation":"The amount representing the full export value of services exported shall be realised and repatriated to India within nine months or within such period as may be specified by the Reserve Bank, in consultation with the Government, from time to time, from the date of export. Reason – Rule 9(1) of the Foreign Exchange Management (Export of Goods & Services) Regulations, 2015 The amount representing the full export value of goods / software/ services exported shall be realised and repatriated to India within nine months or within such period as may be specified by the Reserve Bank, in consultation with the Government, from time to time, from the date of export."},{"id":"13.3","set":"A","stem":"Quantify the amount of penalty, if applicable, if father of Ramesh, Mr. Narottam remit him USD 275,000 in 2021-22 through authorised dealer. Ramesh also studied in same HEI, where his friend Manish did and required to pay same amount of tuition fee:","options":{"a":"Mr. Narottam doesn’t violate any provision, because he remitted the amount through authorised dealer.","b":"Mr. Narottam violates the provisions, therefore liable for penalty up to USD 25000.","c":"Mr. Narottam violates the provisions, therefore liable for penalty up to USD 75000.","d":"Mr. Narottam violates the provisions, therefore liable for penalty up to USD 247500."},"answer":"c","explanation":"Mr. Narottam violates the provisions, therefore liable for penalty up to USD 75000. Reason - As per item number viii in part 1 to schedule III of Foreign Exchange Management (Current Account Transactions) Rules 2000 individual can avail foreign exchange facility within a limit of USD 250000 without prior approval of RBI for the purpose of studies abroad. Further sub-section 1 to section 13 of the Foreign Exchange Management Act 1999, provides if any person contravenes any provision of this Act, or contravenes any rule, regulation, notification, direction, or order issued in exercise of the powers under this Act, or contravenes any condition subject to which an authorisation is issued by the Reserve Bank, he shall, upon adjudication, be liable to a penalty up to thrice the sum involved in such contravention where such amount is quantifiable, or up to two lakh rupees where the amount is not quantifiable, and where such contravention is a continuing one, a further penalty which may extend to five thousand rupees for every day after the first day during which the contravention continues. Here in present case since the amount involved in the contravention is quantifiable, which arrives at USD 25000, because the amount permissible by Schedule III is USD 250000. Hence amount of penalty can be up to USD 75000 (i.e. 3 times of USD 25000) Note - Since university fee was a mere USD 27500 hence, the Liberalised Remittance scheme has no importance here, which otherwise, allow remittance more than UDS 250000 for the purpose of study abroad."},{"id":"13.4","set":"A","stem":"Regarding the residential status of Mr. Ramesh Dayal identify the correct statement out of following;","options":{"a":"Mr. Ramesh is person resident in India for both FY 2021-22 and 2022-23.","b":"Mr. Ramesh is person resident outside India for both FY 2021-22 but person resident in India for FY 2022-23.","c":"Mr. Ramesh is person resident in India for FY 2021-22 but person resident outside India for FY 2022-23.","d":"Mr. Ramesh is person resident outside India for both FY 2021-22 and 2022-23."},"answer":"a","explanation":"Section 2(v) of FEMA 1999 Ramesh Stays more than 182 in each of FY 2021-22 and 2022-23 therefore person resident in India for both the FY 2022-23 and 2023-24. Answer Key 14 Question Answer Reasoning No."},{"id":"14.1","set":"A","stem":"The Certificate of Registration to the University was given only for the purpose of preparing the educational material (print or soft copy), paying of honorarium to teachers and IT related infrastructure for online classes only. Whether Certificate of Registration can be used for receiving foreign contribution for building the infrastructure of the University Campus:","options":{"a":"The funds once received can be utilised for any other purposes.","b":"The funds are being utilised for building construction i.e. for University’s objective so it can be used.","c":"No, the purpose for which the Certificate of Registration has been granted, cannot be diverted. The end use of the funds has to ensured to utilise in that purpose only.","d":"It is on the discretion of the University Officials, how to utilise it."},"answer":"c","explanation":"Section 8(1) of The FCRA, 2010 provides that every person, who is registered and granted a certificate or given prior permission under this Act and receives any foreign contribution,— (a) shall utilise such contribution for the purposes for which the contribution has been received. Provided that any foreign contribution or any income arising out of it shall not be used for speculative business: Provided further that the Central Government shall, by rules, specify the activities or business which shall be construed as speculative business for the purpose of this section; (b) shall not defray as far as possible such sum, not exceeding twenty per cent. of such contribution, received in a financial year, to meet administrative expenses: Provided that administrative expenses exceeding twenty per cent. of such contribution may be defrayed with prior approval of the Central Government. (2) The Central Government may prescribe the elements which shall be included in the administrative expenses and the manner in which the administrative expenses referred to in sub-section (1) shall be calculated."},{"id":"14.2","set":"A","stem":"Whether Foreign contribution so received by the University can be invested in any Mutual Fund Scheme:","options":{"a":"Mutual Fund Scheme are safe, hence can be invested","b":"All Mutual Fund Schemes are not safe and very volatile in nature.","c":"The surplus funds can invested only debt based secure investments","d":"It depends upon the discretion of the University officials."},"answer":"c","explanation":"No. Speculative activities have been defined in Rule 4 of FCRR – 2011 as under:- 1. (a) any activity or investment that has an element of risk of appreciation or depreciation of the original investment, linked to marked forces, including investment in mutual funds or in shares; (b) participation in any scheme that promises high returns like investment in chits or land or similar assets not directly linked to the declared aims and objectives of the organization or association. (2) A debt-based secure investment shall not be treated as speculative investment. Answer Key 15 Question Answer Reasoning No."},{"id":"15.1","set":"A","stem":"Regarding the view point of Rim Jim Limited, that it’s representative shall also be allowed to attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered. Identify the correct statement in the light of the Insolvency and Bankruptcy Code, 2016:","options":{"a":"Rim Jim Limited may attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered and allowed to vote.","b":"Rim Jim Limited may attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered, but not allowed to vote.","c":"Rim Jim Limited shall not attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered.","d":"Rim Jim Limited may attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered, and vote if allowed by resolution professional."},"answer":"d","explanation":"(d) Rim Jim Limited may attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered, but not allowed to vote. Reason – Section 30(5) of IBC 2016 The resolution applicant may attend the meeting of the committee of creditors in which the resolution plan of the applicant is considered. But the resolution applicant shall not have a right to vote at the meeting of the committee of creditors unless such resolution applicant is also a financial creditor. Mind it Rim-Jim Limited is an operational creditor not the financial creditor."},{"id":"15.2","set":"A","stem":"Under IBC there are two types of debt, Operational and Financial. Identify the correct statement regarding the nature of lease rental arrears:","options":{"a":"Lease rental arrear is financial debt in all cases, for the purpose of IBC, 2016.","b":"Lease rental arrear is financial debt only if lease period is more than 3 years, for the purpose of IBC, 2016.","c":"Lease rental arrear is operational debt in all cases, for the purpose of IBC, 2016.","d":"Lease rental arrear can be operational or financial debt as per mutual understanding between lessor and lessee, for the purpose of IBC, 2016."},"answer":"c","explanation":"Section 5 (21) of IBC 2016 Operational debt means a claim in respect of the provision of goods or services including employment or a debt in respect of the repayment payment of dues arising under any law for the time being in force and payable to the Central Government, any State Government or any local authority Lease is service, and the lessor who rents out space to an entity is an operational creditor to whom the entity owes rent; therefore lease rentals for business purposes fall under the definition of 'Operational Debt' as per Section 5(21) of the IBC."},{"id":"15.3","set":"A","stem":"It is specified in the fact of case scenario that the suppliers of food, beverages and utilities were unpaid for supplies provided in the previous 45-60 days, amounting to around Rs. 9,50,000. Largest among such suppliers is Man Mohan Diary to whom Rs. 2,11,390 is due, who gave notice two week back for payment but no payment was made by Hangout Casa. Can Man Mohan Diary file an application under section 9 of the Code?","options":{"a":"Yes, because amount outstanding or in default is more than Rs.1 lakh.","b":"Yes, because he served the notice and 10 days has been elapsed but no payment has been made.","c":"No, because amount outstanding or in default is less than Rs. 10 lakh.","d":"No, because amount outstanding or in default is less than Rs. 100 lakh."},"answer":"d","explanation":"Section 4 of IBC 2016 The Part II of code (i.e. Insolvency resolution and liquidation for corporate persons) shall apply to matters relating to the insolvency and liquidation of corporate debtors where the minimum amount of the default is one lakh crore: Note - Earlier (till 24.03.2020) the threshold was one lac. But proviso to section empower the Central Government to specify the minimum amount of default of higher value which shall not be more than one crore rupees, by notification in this regard. In exercise of the powers conferred by such proviso, the Central Government through Notification No. SO 1205(E) dated 24th March 2020, specifies one crore rupees as the minimum amount of default for the purposes of the said section."},{"id":"15.4","set":"A","stem":"For most of its own-run (Owned and Operated Hangout Casa; other than franchised) outlets the salaries due to employees (chef, assistant chef, waiters and house-keeping staff) were paid in half since the past three months. What is nature of outstanding employee’s dues?","options":{"a":"These are neither operational debt nor financial debt","b":"These are financial debt in all the case for the purpose of IBC","c":"These are operational debt in all the case for the purpose of IBC","d":"These are operational debt if is in arrear for less than 3 month and beyond, classified as financial debt."},"answer":"c","explanation":"Section 5 (21) of IBC 2016 Operational debt means a claim in respect of the provision of goods or services including employment or a debt in respect of the repayment payment of dues arising under any law for the time being in force and payable to the Central Government, any State Government or any local authority"},{"id":"15.5","set":"A","stem":"Ms. Naziya Khatoon, Resolution Professional for Hangout Casa, need your advice regarding constitution of committee of creditors. Advise her regarding correctness of following statements pertaining to committee of creditors. i. Committee of creditor shall be constituted by interim resolution professional after collation of all the claim received against corporate debtor and determination of financial position. ii. Committee of creditor shall comprise of all the creditors. iii. Related party shall not have right to representation at committee of creditors. iv. Those who own both financial as well operational debt, shall also, included in committee of creditors; but only to the extent of financial debt owed by Hangout Casa to such creditors.","options":{"a":"Only statement i, ii and iii are correct","b":"Only statement ii, iii and iv are correct","c":"Only statement i, iii and iv are correct","d":"All the statements are correct"},"answer":"b","explanation":"Sub-section 1, 2 and 4 of section 21 of IBC, 2016 Sub-section 1 requires interim resolution professional shall after collation of all claims received against the corporate debtor and determination of the financial position of the corporate debtor constitute a committee of creditors. Sub-section 2 provides the committee of creditors shall comprise all financial creditors of the corporate debtor, but the proviso further read as \"a financial creditor or the authorized representative of the financial creditor referred to in subsection (6) or sub-section (6A) or sub-section (5) of section 24, if it is a related party of the corporate debtor, shall not have any right of representation, participation or voting in a meeting of the committee of creditors. Sub-section 4 (a) further provides that where any person is a financial creditor as well as an operational creditor, then such person shall be a financial creditor to the extent debt owed by corporate debtor, and shall be included in the committee of creditors, with voting share proportionate to the extent of financial debts owed to such creditor."},{"id":"A1.1","set":"B","stem":"The target profit required is 25% of revenue. If the sale price per statue is ₹45,000 what is the target cost per statue?","options":{"a":"₹33,750 per statue","b":"₹36,000 per statue","c":"₹42,000 per statue","d":"₹56,250 per statue"},"answer":"a","explanation":"Reason – Target profit per statue is 25% of ₹45,000. Therefore, target profit is ₹11,250 per statue. Hence, target cost = selling price – target profit = ₹45,000 - ₹11,250 = ₹33,750 per statue. Option (b) ₹36,000 calculates that cost by taking profit to be 25% of cost i.e. 20% of selling price. Therefore, target cost is ₹45,000 - ₹9,000 = ₹36,000 per statue. Options (c) and (d) are incorrect options."},{"id":"A1.2","set":"B","stem":"What is the cost estimate per unit as per the cost information given above?","options":{"a":"₹45,000 per statue","b":"₹42,500 per statue","c":"₹30,250 per statue","d":"₹43,000 per statue"},"answer":"b","explanation":"Reason – Option (b) ₹42,500 per statue is the correct option. The calculation is given: Cost Amount (₹) Design cost 5,00,000 Direct materials 20,00,000 Direct manufacturing labour 25,00,000 Variable manufacturing overhead 20,00,000 Fixed manufacturing overhead 5,00,000 Marketing 10,00,000 Total Estimated Cost 8,500,000 Es(cid:415)mated Cost per statue = ₹85,00,000 / 200 statues = ₹42,500 per statue."},{"id":"A1.3","set":"B","stem":"During the course of discussions, Jay the product manager found that the designer Raj plans to use high quality marble for these statues. Jay suggests that he use a much lower quality marble material for the statues. This would reduce the material cost by 60%. Skilled labour hours required will also be reduced resulting in direct manufacturing labour to reduce by 50%. Accordingly, what would the revised estimate cost per unit be if value engineering is applied?","options":{"a":"₹45,000 per statue","b":"₹42,500 per statue","c":"₹30,250 per statue","d":"₹43,000 per statue"},"answer":"c","explanation":"Reason – With 60% saving in direct material cost and 50% saving in direct manufacturing labour, the revised estimate cost per statue if value engineering is adopted would be: Cost Amount (₹) Design cost 5,00,000 Direct materials 8,00,000 Direct manufacturing labour 12,50,000 Variable manufacturing overhead 20,00,000 Fixed manufacturing overhead 5,00,000 Marketing 10,00,000 Total Estimated Cost 60,50,000 Es(cid:415)mated Cost per statue = ₹60,50,000 / 200 statues = ₹30,250 per statue."},{"id":"A1.4","set":"B","stem":"Raj the designer does not agree with Jay’s proposition given in (3) above. He feels that inferior quality material would affect the durability of the statue and hence would affect the demand for it in the long run. Instead of value engineering, he feels that 10% increased spending in marketing can increase the selling price per statue to ₹50,000 per statue. The target profit required is 25% of revenue. Given this scenario, what is the target cost per statue?","options":{"a":"₹33,750 per statue","b":"₹37,500 per statue","c":"₹35,000 per statue","d":"₹36,250 per statue"},"answer":"b","explanation":"Reason – The target profit per statue is 25% of ₹50,000. Therefore, target profit is ₹12,500 per statue. Hence, target cost = selling price – target profit = ₹50,000 - ₹12,500 = ₹37,500 per statue."},{"id":"A1.5","set":"B","stem":"Given the situation in (4) what would be revised estimated cost per statue after increasing the spend on marketing?","options":{"a":"₹45,000 per statue","b":"₹42,500 per statue","c":"₹30,250 per statue","d":"₹43,000 per statue"},"answer":"d","explanation":"Reason – The revised estimate cost per statue would be: Cost Amount (₹) Design cost 5,00,000 Direct materials 20,00,000 Direct manufacturing labour 25,00,000 Variable manufacturing overhead 20,00,000 Fixed manufacturing overhead 5,00,000 Marketing 11,00,000 Total Estimated Cost 86,00,000 Estimated Cost per statue = ₹86,00,000 / 200 statues = ₹43,000 per statue."},{"id":"A1.6","set":"B","stem":"What is the estimate profit earned per statue as per (3) (adopting value engineering) and (4) (increasing marketing spend)?  Profit per statue with value Profit per statue after increased engineering as per (3) marketing spend as per (4)","options":{"a":"₹14,750 ₹7,000 Page 2 of 18","b":"₹2,500 ₹7,000","c":"₹11,250 ₹12,500 Case Scenario A2 Fix It is a company that provides home services to clients within few urban cities like Mumbai, Delhi and Kolkata. These services include (1) home repairs like plumbing, electrical etc. and (2) appliance repair services. The company receives enquiries at its call centre for the specific service required. The call centre assistants log the enquiry and provide a quote for the specific service. If acceptable to the customer, the enquiry is then converted into a service request (sales) and is attended to by professionals employed by the company for these various services. A request can have multiple requirements included, for example a single request can include both plumbing and electrical work. The company has
