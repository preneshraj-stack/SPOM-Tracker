<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPOM Study Tracker</title>
<style>
:root{--bg:#faf8f4;--cd:#fff;--ink:#1d1b16;--mu:#6f6a5e;--ln:#e6e0d3;--ac:#1f5f4a;--soft:#e4f0ea;--rv:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15140f;--cd:#1f1d17;--ink:#f1ede2;--mu:#a39d8d;--ln:#34312a;--ac:#6fc3a3;--soft:#1f2e28;--rv:#e0a84a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15140f;--cd:#1f1d17;--ink:#f1ede2;--mu:#a39d8d;--ln:#34312a;--ac:#6fc3a3;--soft:#1f2e28;--rv:#e0a84a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 24px/1.2 Georgia,serif;margin:0 0 2px}h2{font:600 16px Georgia,serif;margin:22px 0 8px}
.sub{color:var(--mu);margin:0 0 16px;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
nav button,.btn{border:1px solid var(--ln);background:var(--cd);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px;min-width:0}
.grow{flex:1 1 140px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.days{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:8px}.days div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.days i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
.ch{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.st{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ln);background:none;color:var(--bg);cursor:pointer;font-size:15px;flex:none}
.st.s1{background:var(--ac);border-color:var(--ac)}.st.s2{background:var(--rv);border-color:var(--rv)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--ln)}th{font-size:12px;color:var(--mu);border:0}
.note{color:var(--mu);font-size:13px}
.ta{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}details summary{cursor:pointer}
</style></head><body><main>
<h1>SPOM Study Tracker</h1>
<p class="sub">Set A: Corporate &amp; Economic Laws · Set B: Strategic Cost &amp; Performance Management</p>
<nav id="nav"></nav><div id="v"></div>
</main>
<script>
const SETS=[
{n:"Set A · Corporate & Economic Laws",p:"a",c:["Co. Law 1 · Appointment & Qualification of Directors","Co. Law 2 · Managerial Personnel: Appointment & Remuneration","Co. Law 3 · Meetings of Board & Its Powers","Co. Law 4 · Inspection, Inquiry & Investigation","Co. Law 5 · Compromises, Arrangements & Amalgamations","Co. Law 6 · Prevention of Oppression & Mismanagement","Co. Law 7 · Winding Up","Co. Law 8 · Miscellaneous Provisions","Co. Law 9 · Adjudication, Special Courts, NCLT & NCLAT","Co. Law 10 · e-Filing","Securities Laws · SEBI Act, LODR, ICDR, SAST, PIT","Economic Laws 1 · FEMA, 1999","Economic Laws 2 · FCRA, 2010","Economic Laws 3 · IBC, 2016"]},
{n:"Set B · Strategic Cost & Performance Mgmt",p:"b",c:["1 · Intro to Strategic Cost Management","2 · Modern Business Environment","3 · Lean System & Innovation","4 · Specialist Cost Management Techniques","5 · Cost Management for Emerging Business Models","6 · Strategic Revenue Management","7 · Strategic Profit Management","8 · Intro to Strategic Performance Management","9 · Performance Measures in Private Sector","10 · Performance Measures in Not-for-Profits","11 · Preparation of Performance Reports","12 · Divisional Transfer Pricing","13 · Standard Costing","14 · Case Study"]}];
const TOTAL=SETS.reduce((a,s)=>a+s.c.length,0);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=t=>new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const back=n=>{const t=new Date();t.setDate(t.getDate()-n);return iso(t)};
let me={ch:{},logs:[],mocks:[]},all={},names={},uid=null,ref=null,tab="log",msg="";
try{const x=JSON.parse(localStorage.getItem("spom_me")||"null");if(x)me=Object.assign(me,x)}catch(e){}
const $=s=>document.getElementById(s);
function stats(d){const days={};(d.logs||[]).forEach(l=>days[l.d]=(days[l.d]||0)+l.h);
 let wk=0;for(let i=0;i<7;i++)wk+=days[back(i)]||0;
 let st=0,i=days[back(0)]?0:1;while(days[back(i)]){st++;i++}
 const done=Object.values(d.ch||{}).filter(v=>v>0).length,m=(d.mocks||[]).slice(-1)[0];
 return{days,wk,st,done,pct:Math.round(done/TOTAL*100),mk:m?Math.round(m.m/m.t*100):null}}
async function save(){try{localStorage.setItem("spom_me",JSON.stringify(me))}catch(e){}if(!ref)return;try{await ref.set(JSON.parse(JSON.stringify(me)));msg=""}catch(e){msg="Couldn’t sync. Ask the owner to share the page with you as a Contributor."}render()}
function addLog(){const h=parseFloat($("h").value);if(!(h>0&&h<=20))return;me.logs.push({d:$("d").value||back(0),s:$("s").value,h,n:$("n").value.slice(0,80)});me.logs=me.logs.slice(-300);save();render()}
function delLog(i){me.logs.splice(i,1);save();render()}
function cyc(id){me.ch[id]=((me.ch[id]||0)+1)%3;save();render()}
function addMock(){const m=parseFloat($("m").value),t=parseFloat($("t").value);if(!(t>0&&m>=0&&m<=t))return;me.mocks.push({d:back(0),s:$("ms").value,m,t});me.mocks=me.mocks.slice(-100);save();render()}
function delMock(i){me.mocks.splice(i,1);save();render()}
function setExam(){me.exam=$("ex").value||"";save();render()}
function countdown(s){
 const rem=TOTAL-s.done;
 let h=`<div class="card"><div class="row"><b class="grow">Exam countdown</b><input id="ex" type="date" value="${E(me.exam||"")}" onchange="setExam()"></div>`;
 if(me.exam){const dl=Math.round((new Date(me.exam+"T00:00")-new Date(back(0)+"T00:00"))/864e5);
  if(dl>0)h+=`<p style="margin:10px 0 0"><span style="font-size:28px;font-weight:600">${dl}</span> days left · ${Math.floor(dl/7)} weeks${rem?`<br><span class="note">${rem} chapters not yet studied, about ${(rem/Math.max(dl/7,1)).toFixed(1)} a week to finish them all</span>`:""}</p>`;
  else if(dl==0)h+=`<p style="margin:10px 0 0"><b>Exam day. All the best!</b></p>`;
  else h+=`<p class="note" style="margin:10px 0 0">That date has passed. Set your next exam date.</p>`}
 else h+=`<p class="note" style="margin:8px 0 0">Pick your exam date to start the countdown.</p>`;
 return h+`</div>`}
function clean(n){return String(n||"").replace(/[^\w .-]/g,"").trim().slice(0,20)}
function setName(){me.name=clean($("nm").value);save();render()}
function code(){const s=stats(me);return btoa(unescape(encodeURIComponent(JSON.stringify({n:me.name||"Friend",pct:s.pct,mk:s.mk,t:back(0),d:Array.from({length:30},(_,i)=>+((s.days[back(i)]||0).toFixed(2)))}))))}
function frStats(f){if(!f.d)return{wk:f.wk||0,st:f.st||0,pct:f.pct,mk:f.mk};
 const off=Math.max(0,Math.round((new Date(back(0)+"T00:00")-new Date(f.t+"T00:00"))/864e5))||0;
 let wk=0;for(let i=0;i<7;i++){const j=i-off;if(j>=0&&j<30)wk+=f.d[j]||0}
 let st=0,j=f.d[0]?0:1;while(j<30&&f.d[j]>0){st++;j++}
 return{wk,st:off>1?null:st,pct:f.pct,mk:f.mk}}
function cp(id){const t=$(id);t.select();const done=()=>{msg="Copied.";render()};try{navigator.clipboard.writeText(t.value).then(done).catch(()=>{document.execCommand("copy")&&done()})}catch(e){document.execCommand("copy")&&done()}}
function backup(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(me))))}catch(e){return ""}}
function restore(){try{const x=JSON.parse(decodeURIComponent(escape(atob($("rs").value.trim()))));if(!x||typeof x!="object"||!Array.isArray(x.logs)||!x.ch)throw 0;me=Object.assign({ch:{},logs:[],mocks:[]},x);msg="Restored.";save()}catch(e){msg="That backup code didn’t work."}render()}
function bkCard(){return `<details class="card"><summary><b>Backup &amp; restore</b></summary><p class="note">If you use the downloaded file, your tracker is saved in that browser only. Copy this backup code somewhere safe, like a note to yourself, and paste it back here to restore it on a new phone or browser.</p><textarea id="bk" readonly rows="3" class="ta" onclick="this.select()">${backup()}</textarea><div class="row" style="margin:6px 0 10px"><button class="btn" onclick="cp('bk')">Copy backup</button></div><textarea id="rs" rows="2" class="ta" placeholder="Paste a backup code to restore. This replaces what is on this device."></textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="restore()">Restore</button></div></details>`}
function addCode(){const T=$("cd").value.match(/[A-Za-z0-9+\/=]{40,}/g)||[];let ok=0;me.fr=me.fr||{};
 T.forEach(k=>{try{const f=JSON.parse(decodeURIComponent(escape(atob(k))));const n=clean(f.n),t=String(f.t||"").slice(0,10);if(!n||n==clean(me.name))return;const o=me.fr[n];if(o&&o.t>t)return;
  me.fr[n]={pct:+f.pct||0,mk:f.mk==null?null:+f.mk,t,wk:+f.wk||0,st:+f.st||0,d:Array.isArray(f.d)?f.d.slice(0,30).map(x=>Math.min(24,Math.max(0,+x||0))):null};ok++}catch(e){}});
 msg=ok?"Added "+ok+" friend"+(ok>1?"s":"")+".":"No valid codes found. Ask your friend to copy theirs again.";if(ok)$("cd").value="";save();render()}
function delFr(n){if(me.fr)delete me.fr[n];save();render()}
function setTab(t){tab=t;msg="";render()}
function render(){
 $("nav").innerHTML=[["log","Study log"],["ch","Chapters"],["mk","Mock tests"],["fr","Friends"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
 const s=stats(me),opts=SETS.map(x=>`<option>${E(x.n)}</option>`).join("");let h="";
 if(msg)h+=`<p class="note">${E(msg)}</p>`;
 if(tab=="log"){
  h+=countdown(s);
  h+=`<div class="stats"><div class="stat"><b>${s.wk.toFixed(1)}</b><span>hours, 7 days</span></div><div class="stat"><b>${s.st}</b><span>day streak</span></div><div class="stat"><b>${s.pct}%</b><span>chapters done</span></div></div>
  <div class="card"><div class="row"><input id="d" type="date" value="${back(0)}"><select id="s" class="grow">${opts}</select><input id="h" type="number" step="0.25" min="0" max="20" placeholder="Hours" style="width:90px"></div>
  <div class="row" style="margin-top:8px"><input id="n" class="grow" placeholder="What did you cover? (optional)"><button class="btn pri" onclick="addLog()">Add</button></div></div>`;
  const mx=Math.max(1,...Array.from({length:7},(_,i)=>s.days[back(6-i)]||0));
  h+=`<div class="card"><b>Last 7 days</b><div class="days">${Array.from({length:7},(_,i)=>{const k=back(6-i),v=s.days[k]||0;return `<div><i style="height:${v/mx*52}px"></i>${new Date(k+"T00:00").toLocaleDateString("en",{weekday:"short"}).slice(0,2)}</div>`}).join("")}</div></div><h2>Recent sessions</h2>`;
  const L=me.logs.map((l,i)=>[l,i]).slice(-10).reverse();
  h+=L.length?L.map(([l,i])=>`<div class="card row"><div class="grow"><b>${l.h}h</b> · ${E(l.s.split(" · ")[0])}<br><span class="note">${E(l.d)}${l.n?" · "+E(l.n):""}</span></div><button class="x" onclick="delLog(${i})" aria-label="Delete">×</button></div>`).join(""):`<p class="note">No sessions yet. Log your first one above.</p>`;
 }
 if(tab=="ch"){
  h+=`<p class="note">Tap a box: once for studied, twice for revised, a third time to clear.</p>`;
  SETS.forEach(S=>{const dn=S.c.filter((_,i)=>me.ch[S.p+i]>0).length;
   h+=`<h2>${E(S.n)}</h2><div class="bar"><i style="width:${dn/S.c.length*100}%"></i></div><p class="note">${dn} of ${S.c.length} studied · ${S.c.filter((_,i)=>me.ch[S.p+i]==2).length} revised</p><div class="card" style="padding:4px 14px">`+S.c.map((c,i)=>{const v=me.ch[S.p+i]||0;return `<div class="ch"><button class="st s${v}" onclick="cyc('${S.p+i}')" aria-label="Toggle">${v==2?"★":v==1?"✓":""}</button><span>${E(c)}</span></div>`}).join("")+`</div>`})}
 if(tab=="mk"){
  h+=`<div class="card"><div class="row"><select id="ms" class="grow">${opts}</select><input id="m" type="number" min="0" placeholder="Marks" style="width:90px"><input id="t" type="number" min="1" value="100" style="width:90px"><button class="btn pri" onclick="addMock()">Add</button></div></div>`;
  const M=me.mocks.map((m,i)=>[m,i]).reverse();
  h+=M.length?M.map(([m,i])=>`<div class="card row"><div class="grow"><b>${m.m}/${m.t}</b> (${Math.round(m.m/m.t*100)}%) · ${E(m.s.split(" · ")[0])}<br><span class="note">${E(m.d)}</span></div><button class="x" onclick="delMock(${i})" aria-label="Delete">×</button></div>`).join(""):`<p class="note">Add mock or test scores to see your trend.</p>`}
 if(tab=="fr"){
  h+=`<div class="card"><b>Share with friends</b><p class="note" style="margin:4px 0 10px">Each friend sends their code. Paste as many as you like at once, even a whole group chat. Hours and streaks are worked out from the daily hours inside each code, so ask friends for a fresh code every week.</p><div class="row"><input id="nm" class="grow" placeholder="Your name" value="${E(me.name||"")}" onchange="setName()"></div><p class="note" style="margin:10px 0 4px">1. Copy your code and send it to your friends:</p><textarea id="mc" readonly rows="3" class="ta" onclick="this.select()" style="width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px">${me.name?code():"Enter your name first"}</textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="cp('mc')">Copy my code</button></div><p class="note" style="margin:10px 0 4px">2. Paste your friends’ codes (one or many):</p><div class="row"><textarea id="cd" rows="2" class="ta grow" placeholder="Paste codes here"></textarea><button class="btn pri" onclick="addCode()">Add</button></div></div>`;
  const R=Object.entries(all).map(([id,d])=>({id,s:stats(d)})).concat(ref?[]:[{id:"me",me:1,n:me.name||"You",s}]).concat(Object.entries(me.fr||{}).map(([n,f])=>({id:"fr:"+n,n,t:f.t,s:frStats(f)}))).sort((a,b)=>b.s.wk-a.s.wk);
  h+=R.length?`<div class="card wrap"><table><tr><th>Name</th><th>7-day hrs</th><th>Streak</th><th>Chapters</th><th>Last mock</th></tr>`+R.map(r=>`<tr><td>${E(r.n||names[r.id]||"Friend")}${r.id==uid||r.me?" (you)":""}${r.t?` <span class="note">· ${E(r.t)}</span> <button class="x" onclick="delFr('${r.n}')" aria-label="Remove">×</button>`:""}</td><td>${r.s.wk.toFixed(1)}</td><td>${r.s.st==null?"–":r.s.st}</td><td>${r.s.pct}%</td><td>${r.s.mk==null?"–":r.s.mk+"%"}</td></tr>`).join("")+`</table></div>`:`<p class="note">Nobody has logged anything yet.</p>`}
 if(tab=="fr")h+=bkCard();
 $("v").innerHTML=h}
render();
(async()=>{try{
 const user=await claude.use("user"),db=await claude.use("db");if(!user||!db)return;
 uid=await user.id();if(!uid)return;ref=db.doc("tracker/"+uid);
 db.collection("tracker").onSnapshot(async q=>{all={};q.docs.forEach(d=>all[d.id]=JSON.parse(JSON.stringify(d.data())));
  if(all[uid])me=Object.assign({ch:{},logs:[],mocks:[]},all[uid]);
  const ps=await user.profiles(Object.keys(all));for(const k in ps)names[k]=ps[k].name||"";render()},()=>{});
 render()}catch(e){}})();
</script></body></html>
