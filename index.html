<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS",Trebuchet,Verdana,sans-serif}

.sub{color:var(--mu);margin:0 0 16px;font-size:13px}

.grow{flex:1 1 140px}

/* Modern navy dashboard theme inspired by the requested reference; all tracker logic/features remain intact. */
:root{--bg:#050d1a;--cd:#0b1729;--ink:#eef5ff;--mu:#9eb2d0;--ln:#1d3557;--ac:#168bff;--soft:#102b4d;--rv:#a855f7;color-scheme:dark}
html,body{min-height:100%;background:radial-gradient(ellipse at 65% -15%,#122b50 0%,#071326 43%,#040b15 100%);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.55}
main{max-width:none;width:auto;margin:0 20px 0 245px;padding:24px 22px 48px}

nav button:hover,.btn:hover{border-color:#168bff;transform:translateY(-1px)}

.card{background:linear-gradient(145deg,rgba(13,29,51,.97),rgba(7,19,35,.98));border:1px solid #1b3558;border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:0 8px 24px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.025)}

a{color:#67b7ff}button:focus-visible,a:focus-visible{outline:2px solid #39b9ff;outline-offset:2px}

/* Dashboard polish */
:root{--bg:#06101f;--cd:#0b1a2e;--ink:#edf5ff;--mu:#9bb0cb;--ln:#203958;--ac:#2388ff;--soft:#102943;--rv:#9b72ff}
body{background:radial-gradient(ellipse at 75% -20%,#173a66 0%,#071427 42%,#040a14 100%)}
.welcome{display:flex;align-items:center;justify-content:space-between;min-height:118px;padding:22px 24px;background:linear-gradient(115deg,rgba(17,68,126,.72),rgba(10,26,46,.96) 65%);overflow:hidden;position:relative}
.welcome h2{color:#f5f9ff}.welcome-mark{font-size:76px;color:#46c9ff;opacity:.8;padding:0 18px;text-shadow:0 0 28px rgba(35,136,255,.4)}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#66baff}
.muted{color:var(--mu)}.dashboard-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.dashboard-stats .stat{text-align:left;background:linear-gradient(145deg,#102845,#0a192c);padding:16px;border:1px solid #244365}
.dashboard-stats .stat>span{font-size:10px;letter-spacing:.7px;font-weight:800}.dashboard-stats .stat b{font-size:28px;margin:6px 0}.dashboard-stats .stat small{display:block;color:var(--mu);font-size:11px;margin-top:8px}
.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;align-items:stretch}
.grid-two>.card{min-width:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h2{margin-top:0}
.module-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-top:1px solid var(--ln)}.module-icon{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:12px;background:#123d68;color:#75c7ff;font-size:18px;font-weight:800}.module-icon.violet{background:#2a2051;color:#c3aaff}
.module-info{flex:1;min-width:0}.module-info b{font-size:12px;display:block;margin-bottom:8px}.module-info small{display:block;color:var(--mu);font-size:11px;margin-top:6px}.module-row>strong{font-size:15px}
.exam-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mini-exam{display:flex;flex-direction:column;gap:7px;padding:13px;border:1px solid var(--ln);border-radius:12px;background:rgba(5,16,31,.55)}.mini-exam b{font-size:20px}.mini-exam .btn{align-self:flex-start;font-size:12px}
.pill{font-size:11px;border-radius:999px;padding:5px 9px;background:#123b5e;color:#8bd7ff}.focus-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}.focus-item>div{min-width:0}.focus-item b{display:block;font-size:12px}.focus-item small{display:block;color:var(--mu);font-size:11px;margin-top:4px}.focus-dot{width:9px;height:9px;flex:none;border-radius:50%;background:#2ec7f0;box-shadow:0 0 12px rgba(46,199,240,.35);margin-top:5px}.violet-dot{background:#a78bfa;box-shadow:0 0 12px rgba(167,139,250,.35)}
.mock-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);font-size:12px}.mock-row span small{display:block;color:var(--mu);font-size:10px;margin-top:3px}.mock-row strong{color:#6ed9ff}
.resource-link{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-top:1px solid var(--ln);color:#d8eaff;text-decoration:none;font-size:13px}.resource-link:hover{color:#69c9ff}.resource-link b{color:#6dbbff;font-size:17px}
.days small{display:block;font-size:9px;color:var(--mu);margin-top:3px}
button,a,input,select,textarea{transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #45c8ff;outline-offset:3px}
@media(max-width:900px){main{margin-left:225px}.grid-two{grid-template-columns:1fr}.dashboard-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){main{margin:0}.welcome{padding:18px;min-height:100px}.welcome-mark{font-size:52px;padding:0 4px}.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-stats .stat:last-child{grid-column:1/-1}.exam-grid{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.dashboard-stats{grid-template-columns:1fr 1fr}.dashboard-stats .stat{padding:12px}.dashboard-stats .stat b{font-size:23px}.welcome h2{font-size:21px!important}.welcome-mark{display:none}.exam-grid{grid-template-columns:1fr}.module-info b{font-size:11px}}


/* SPOM Tracker 3.0 upgrades: analytics, focus mode, achievements */
.analytics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{padding:14px;border:1px solid #244365;border-radius:13px;background:linear-gradient(145deg,#102845,#09182b);min-width:0}

</style></head><body><main>
<h1>SPOM Tracker</h1>
<p class="sub">Set A: Corporate &amp; Economic Laws · Set B: Strategic Cost &amp; Performance Management</p>
<nav id="nav"></nav><div id="v"></div>
</main>
<script>
const SETS=[
{n:"Set A · Corporate & Economic Laws",p:"a",c:["Co. Law 1 · Appointment & Qualification of Directors","Co. Law 2 · Managerial Personnel: Appointment & Remuneration","Co. Law 3 · Meetings of Board & Its Powers","Co. Law 4 · Inspection, Inquiry & Investigation","Co. Law 5 · Compromises, Arrangements & Amalgamations","Co. Law 6 · Prevention of Oppression & Mismanagement","Co. Law 7 · Winding Up","Co. Law 8 · Miscellaneous Provisions","Co. Law 9 · Adjudication, Special Courts, NCLT & NCLAT","Co. Law 10 · e-Filing","Securities Laws · SEBI Act, LODR, ICDR, SAST, PIT","Economic Laws 1 · FEMA, 1999","Economic Laws 2 · FCRA, 2010","Economic Laws 3 · IBC, 2016"]},
{n:"Set B · Strategic Cost & Performance Mgmt",p:"b",c:["1 · Intro to Strategic Cost Management","2 · Modern Business Environment","3 · Lean System & Innovation","4 · Specialist Cost Management Techniques","5 · Cost Management for Emerging Business Models","6 · Strategic Revenue Management","7 · Strategic Profit Management","8 · Intro to Strategic Performance Management","9 · Performance Measures in Private Sector","10 · Performance Measures in Not-for-Profits","11 · Preparation of Performance Reports","12 · Divisional Transfer Pricing","13 · Standard Costing","14 · Case Study"]}];
const TOTAL=SETS.reduce((a,s)=>a+s.c.length,0);
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=t=>new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const back=n=>{const t=new Date();t.setDate(t.getDate()-n);return iso(t)};
let me={ch:{},logs:[],mocks:[]},all={},names={},uid=null,ref=null,tab="dash",msg="";
try{const x=JSON.parse(localStorage.getItem("spom_me")||"null");if(x)me=Object.assign(me,x)}catch(e){}
const $=s=>document.getElementById(s);
function stats(d){const days={};(d.logs||[]).forEach(l=>days[l.d]=(days[l.d]||0)+l.h);
 let wk=0;for(let i=0;i<7;i++)wk+=days[back(i)]||0;
 let st=0,i=days[back(0)]?0:1;while(days[back(i)]){st++;i++}
 const done=Object.values(d.ch||{}).filter(v=>v>0).length,m=(d.mocks||[]).slice(-1)[0];
 return{days,wk,st,done,pct:Math.round(done/TOTAL*100),mk:m?Math.round(m.m/m.t*100):null}}
async function save(){try{localStorage.setItem("spom_me",JSON.stringify(me))}catch(e){}if(!ref)return;try{await ref.set(JSON.parse(JSON.stringify(me)));msg=""}catch(e){msg="Couldn’t sync. Ask the owner to share the page with you as a Contributor."}render()}
function addLog(){const h=parseFloat($("h").value);if(!(h>0&&h<=20))return;me.logs.push({d:$("d").value||back(0),s:$("s").value,h,n:$("n").value.slice(0,80)});me.logs=me.logs.slice(-300);save();render()}
function delLog(i){me.logs.splice(i,1);save();render()}
function cyc(id){const v=((me.ch[id]||0)+1)%5;me.ch[id]=v;if(v==1)conf();save();render()}
function addMock(){const m=parseFloat($("m").value),t=parseFloat($("t").value);if(!(t>0&&m>=0&&m<=t))return;me.mocks.push({d:back(0),s:$("ms").value,m,t});me.mocks=me.mocks.slice(-100);save();render()}
function delMock(i){me.mocks.splice(i,1);save();render()}
function setExam(){me.exam=$("ex").value||"";save();render()}
function countdown(s){
 const rem=TOTAL-s.done;
 let h=`<div class="card"><div class="row"><b class="grow">Exam countdown</b><input id="ex" type="date" value="${E(me.exam||"")}" onchange="setExam()"></div>`;
 if(me.exam){const dl=Math.round((new Date(me.exam+"T00:00")-new Date(back(0)+"T00:00"))/864e5);
  if(dl>0)h+=`<p style="margin:10px 0 0"><span style="font-size:28px;font-weight:600">${dl}</span> days left · ${Math.floor(dl/7)} weeks${rem?`<br><span class="note">${rem} chapters not yet studied, about ${(rem/Math.max(dl/7,1)).toFixed(1)} a week to finish them all</span>`:""}</p>`;
  else if(dl==0)h+=`<p style="margin:10px 0 0"><b>Exam day. All the best!</b></p>`;
  else h+=`<p class="note" style="margin:10px 0 0">That date has passed. Set your next exam date.</p>`}
 else h+=`<p class="note" style="margin:8px 0 0">Pick your exam date to start the countdown.</p>`;
 return h+`</div>`}
function clean(n){return String(n||"").replace(/[^\w .-]/g,"").trim().slice(0,20)}
function setName(){me.name=clean($("nm").value);save();render()}
function code(){const s=stats(me);return btoa(unescape(encodeURIComponent(JSON.stringify({n:me.name||"Friend",pct:s.pct,mk:s.mk,t:back(0),d:Array.from({length:30},(_,i)=>+((s.days[back(i)]||0).toFixed(2)))}))))}
function frStats(f){if(!f.d)return{wk:f.wk||0,st:f.st||0,pct:f.pct,mk:f.mk};
 const off=Math.max(0,Math.round((new Date(back(0)+"T00:00")-new Date(f.t+"T00:00"))/864e5))||0;
 let wk=0;for(let i=0;i<7;i++){const j=i-off;if(j>=0&&j<30)wk+=f.d[j]||0}
 let st=0,j=f.d[0]?0:1;while(j<30&&f.d[j]>0){st++;j++}
 return{wk,st:off>1?null:st,pct:f.pct,mk:f.mk}}
function cp(id){const t=$(id);t.select();const done=()=>{msg="Copied.";render()};try{navigator.clipboard.writeText(t.value).then(done).catch(()=>{document.execCommand("copy")&&done()})}catch(e){document.execCommand("copy")&&done()}}
function backup(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(me))))}catch(e){return ""}}
function restore(){try{const x=JSON.parse(decodeURIComponent(escape(atob($("rs").value.trim()))));if(!x||typeof x!="object"||!Array.isArray(x.logs)||!x.ch)throw 0;me=Object.assign({ch:{},logs:[],mocks:[]},x);msg="Restored.";save()}catch(e){msg="That backup code didn’t work."}render()}
function bkCard(){return `<details class="card"><summary><b>Backup &amp; restore</b></summary><p class="note">Your tracker auto-saves in this browser using local storage, so closing the tab or browser normally will not erase it. It will not automatically sync to another device/browser, and clearing browser data can erase it. For extra safety, copy this backup code somewhere safe and restore it later on this or another device.</p><textarea id="bk" readonly rows="3" class="ta" onclick="this.select()">${backup()}</textarea><div class="row" style="margin:6px 0 10px"><button class="btn" onclick="cp('bk')">Copy backup</button></div><textarea id="rs" rows="2" class="ta" placeholder="Paste a backup code to restore. This replaces what is on this device."></textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="restore()">Restore</button></div></details>`}
function addCode(){const T=$("cd").value.match(/[A-Za-z0-9+\/=]{40,}/g)||[];let ok=0;me.fr=me.fr||{};
 T.forEach(k=>{try{const f=JSON.parse(decodeURIComponent(escape(atob(k))));const n=clean(f.n),t=String(f.t||"").slice(0,10);if(!n||n==clean(me.name))return;const o=me.fr[n];if(o&&o.t>t)return;
  me.fr[n]={pct:+f.pct||0,mk:f.mk==null?null:+f.mk,t,wk:+f.wk||0,st:+f.st||0,d:Array.isArray(f.d)?f.d.slice(0,30).map(x=>Math.min(24,Math.max(0,+x||0))):null};ok++}catch(e){}});
 msg=ok?"Added "+ok+" friend"+(ok>1?"s":"")+".":"No valid codes found. Ask your friend to copy theirs again.";if(ok)$("cd").value="";save();render()}
function delFr(n){if(me.fr)delete me.fr[n];save();render()}
function setAc(c){me.ac=c;save();render()}
function ring(p,l,c){const r=26,C=2*Math.PI*r;return `<div style="text-align:center"><svg width="76" height="76" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="var(--ln)" stroke-width="8"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${p}%</text></svg><div class="note">${l}</div></div>`}

function rings(s){return `<div class="card"><div class="row" style="justify-content:space-around">${ring(s.pct,"Overall","var(--ac)")}${ring(setPct(SETS[0]),"Set A","#e76f51")}${ring(setPct(SETS[1]),"Set B","#3d85c6")}</div></div>`}
function plan(){const un=[];SETS.forEach(S=>S.c.forEach((c,i)=>{if(!(me.ch[S.p+i]>0))un.push(S.n.slice(0,5)+": "+c.split(" · ").slice(-1)[0])}));
 const ds=[me.exam,me.examB].filter(Boolean).map(x=>Math.round((new Date(x+"T00:00")-new Date(back(0)+"T00:00"))/864e5)).filter(x=>x>0);let h;
 if(un.length){const n=ds.length?Math.max(1,Math.ceil(un.length/Math.min(...ds))):2;h="Study today: "+un.slice(0,n).map(E).join(" · ")}
 else{const rv=[];SETS.forEach(S=>S.c.forEach((c,i)=>{const v=me.ch[S.p+i]||0;if(v<4)rv.push([v,c])}));rv.sort((a,b)=>a[0]-b[0]);h=rv.length?"All chapters studied. Revise today: "+E(rv[0][1]):"Every chapter is revised three times. Great work!"}

function countdown(s){return `<div class="card"><b>Exam countdown</b>`+[["exam",0],["examB",1]].map(([k,i])=>{const S=SETS[i],rem=S.c.filter((_,j)=>!(me.ch[S.p+j]>0)).length;let t="";
 if(me[k]){const dl=Math.round((new Date(me[k]+"T00:00")-new Date(back(0)+"T00:00"))/864e5);t=dl>0?`<span style="font-size:26px;font-weight:700">${dl}</span> days left`+(rem?` · ${rem} chapters left, about ${(rem/Math.max(dl/7,1)).toFixed(1)} a week`:" · all studied"):dl==0?"<b>Exam day. All the best!</b>":"That date has passed."}
 return `<div class="row" style="margin-top:10px"><span class="grow">${E(S.n.split(" · ")[0])}<br><span class="note">${E(S.n.split(" · ")[1])}</span></span><input id="ex_${k}" type="date" value="${E(me[k]||"")}" onchange="setExam('${k}')"></div>${t?`<p style="margin:4px 0 0">${t}</p>`:""}`}).join("")+`</div>`}
function setGoal(){me.goal=Math.max(0,Math.min(100,+$("gl").value||0));save();render()}
function tStart(){me.timer={t0:Date.now(),s:$("ts").value};save();render()}
function tStop(){const t=me.timer;if(!t)return;const h=+((Date.now()-t.t0)/36e5).toFixed(2);me.timer=null;if(h>=0.02){me.logs.push({d:back(0),s:t.s,h,n:"Timer"});me.logs=me.logs.slice(-300)}save();render()}

setInterval(()=>{const e=$("tm");if(e&&me.timer){const x=Math.floor((Date.now()-me.timer.t0)/1e3);e.textContent=Math.floor(x/3600)+":"+String(Math.floor(x%3600/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
 const fc=$("focusClock");if(fc&&me.focus&&me.focus.running){const x=focusSeconds();if(x<=0){focusFinish();return}fc.textContent=String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");const ring=fc.closest(".focus-ring");if(ring)ring.style.setProperty("--focus-pct",Math.max(0,Math.min(100,(1-x/Math.max(1,me.focus.duration||1500))*100))+"%")}},1000);
function heat(){const s=stats(me);let g="";for(let w=0;w<12;w++)for(let d=0;d<7;d++){const k=back((11-w)*7+(6-d)),v=s.days[k]||0;g+=`<i title="${k}: ${v}h" style="background:${v?"var(--ac)":"var(--ln)"};opacity:${v?Math.min(1,.25+v*.15):1}"></i>`}
 return `<div class="card"><b>Last 12 weeks</b><div class="hm">${g}</div></div>`}

 return `<div class="card"><b>Badges</b><div class="row" style="margin-top:8px">${L.map(([e,t,o])=>`<span class="bdg${o?" on":""}">${e} ${t}</span>`).join("")}</div></div>`}

function trend(){const M=me.mocks||[];if(M.length<2)return "";const P=M.map(m=>m.m/m.t*100),W=300,H=90,x=i=>10+i*(W-20)/(P.length-1),y=v=>H-8-v*(H-16)/100;
 const av=S=>{const a=M.filter(m=>m.s==S.n);return a.length?Math.round(a.reduce((t,m)=>t+m.m/m.t*100,0)/a.length)+"%":"–"};

function mockAnalytics(){
 const M=me.mocks||[], pct=m=>m.t>0?Math.max(0,Math.min(100,m.m/m.t*100)):0;

 const subjectRows=SETS.map(S=>{const a=M.filter(m=>m.s===S.n);const av=a.length?a.reduce((n,m)=>n+pct(m),0)/a.length:null;return {name:S.n.split(" · ")[0],n:a.length,avg:av}});
 const W=620,H=210,pad=28,xx=i=>pad+(scores.length<=1?0:i*(W-2*pad)/(scores.length-1)),yy=v=>H-pad-v*(H-2*pad)/100;

 const maxSub=Math.max(1,...subjectRows.map(x=>x.n));
 return `<div class="welcome card"><div><span class="eyebrow">PERFORMANCE CENTRE</span><h2 style="font-size:25px;margin:7px 0">Mock test analytics</h2><p class="muted" style="margin:0">Use every attempt to find patterns and improve your next score.</p></div><div class="welcome-mark">↗</div></div>

 <div class="card"><div class="section-head"><div><span class="eyebrow">SCORE BREAKDOWN</span><h2 style="margin:3px 0 0">Recent attempts</h2></div><button class="btn pri" onclick="setTab('mk')">Add mock test</button></div>${M.length?`<div class="score-list">${M.slice(-10).reverse().map((m,i)=>`<div class="score-line"><span>${E(m.s||"Mock test")}<small class="muted" style="display:block">${E(m.d||"")}</small></span><div class="bar"><i style="width:${pct(m)}%"></i></div><b>${m.m}/${m.t} · ${pct(m).toFixed(1)}%</b></div>`).join("")}</div>`:`<p class="muted">Your mock tests will appear here after you record them.</p>`}</div>`;

let focusMode="focus";
function focusSeconds(){const f=me.focus||{};if(f.running&&f.endAt)return Math.max(0,Math.ceil((f.endAt-Date.now())/1000));return Math.max(0,+f.remaining||0)}
function focusStart(mins){
 const f=me.focus||{remaining:1500,mode:"focus",chapter:SETS[0].n};
 if(mins){f.duration=mins*60;f.remaining=mins*60}
 if(!f.remaining)f.remaining=f.duration||1500;
 f.mode=focusMode;f.running=true;f.startedAt=Date.now();f.endAt=Date.now()+f.remaining*1000;me.focus=f;save();render()
}
function focusPause(){const f=me.focus;if(!f)return;f.remaining=focusSeconds();f.running=false;f.endAt=null;me.focus=f;save();render()}
function focusReset(mins){
 const f=me.focus||{};f.running=false;f.endAt=null;f.mode=focusMode;f.duration=(mins||({focus:25,short:5,long:15}[focusMode]||25))*60;f.remaining=f.duration;me.focus=f;save();render()
}
function focusSelect(mode){focusMode=mode;focusReset(({focus:25,short:5,long:15})[mode]||25)}
function focusFinish(){
 const f=me.focus;if(!f||!f.running)return;
 const dur=Math.max(0,Math.round((Date.now()-(f.startedAt||Date.now()))/60000));
 f.running=false;f.endAt=null;f.remaining=0;me.focus=f;
 if(f.mode==="focus"&&dur>=1){me.logs.push({d:back(0),s:f.chapter||SETS[0].n,h:+(dur/60).toFixed(2),n:"Focus session"});me.logs=me.logs.slice(-300);me.focusCompleted=(me.focusCompleted||0)+1}
 msg="Focus session complete! Great work.";save();render()
}

 return `<div class="welcome card"><div><span class="eyebrow">MILESTONES</span><h2 style="font-size:25px;margin:7px 0">Achievements</h2><p class="muted" style="margin:0">Celebrate real progress, one milestone at a time.</p></div><div class="welcome-mark">★</div></div><div class="stats dashboard-stats"><div class="stat"><span>BADGES UNLOCKED</span><b>${earned}/${A.length}</b><div class="bar"><i style="width:${earned/A.length*100}%"></i></div><small>Keep building consistency</small></div><div class="stat"><span>CHAPTERS STUDIED</span><b>${s.done}/${TOTAL}</b><div class="bar"><i style="width:${s.pct}%"></i></div><small>Progress counts</small></div><div class="stat"><span>STUDY HOURS</span><b>${hours.toFixed(1)}h</b><div class="bar"><i style="width:${Math.min(100,hours/100*100)}%"></i></div><small>From your study logs</small></div></div><div class="achievement-grid">${A.map(([emoji,title,desc,ok,val,target])=>`<div class="achievement ${ok?"":"locked"}"><div class="emoji">${ok?emoji:"🔒"}</div><b>${E(title)} ${ok?"✓":""}</b><small>${E(desc)}</small><div class="bar"><i style="width:${Math.min(100,(+val||0)/(+target||1)*100)}%"></i></div><small style="margin-top:6px">${typeof val==="number"?val.toFixed(val%1?1:0):val} / ${target}</small></div>`).join("")}</div>`;
}

function render(){document.documentElement.style.setProperty("--ac",me.ac||"#2a9d8f");
 $("nav").innerHTML=[["dash","Dashboard"],["log","Study log"],["ch","Chapters"],["mk","Mock tests"],["analytics","Analytics"],["focus","Focus mode"],["ach","Achievements"],["fr","Friends"],["res","ICAI links"]].map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
 const s=stats(me),opts=SETS.map(x=>`<option>${E(x.n)}</option>`).join("");let h="";
 if(msg)h+=`<p class="note">${E(msg)}</p>`;

  h+=`<div class="stats dashboard-stats"><div class="stat"><span>OVERALL COMPLETION</span><b>${s.pct}%</b><div class="bar"><i style="width:${s.pct}%"></i></div><small>${s.done} of ${TOTAL} chapters studied</small></div><div class="stat"><span>STUDY THIS WEEK</span><b>${s.wk.toFixed(1)}h</b><div class="bar"><i style="width:${Math.min(100,s.wk/20*100)}%"></i></div><small>${s.st} day streak</small></div><div class="stat"><span>TOTAL STUDY TIME</span><b>${totalHours.toFixed(1)}h</b><div class="bar"><i style="width:${Math.min(100,totalHours/100*100)}%"></i></div><small>Logged across all sessions</small></div></div>`;
  h+=`<div class="grid-two"><div class="card"><div class="section-head"><div><span class="eyebrow">YOUR PROGRESS</span><h2 style="margin:3px 0 0">Module overview</h2></div><button class="btn" onclick="setTab('ch')">Open chapters ↗</button></div><div class="module-row"><div class="module-icon">A</div><div class="module-info"><b>Set A · Corporate &amp; Economic Laws</b><div class="bar"><i style="width:${pa}%"></i></div><small>${pa}% complete · ${a.c.filter((_,i)=>!(me.ch[a.p+i]>0)).length} remaining</small></div><strong>${pa}%</strong></div><div class="module-row"><div class="module-icon violet">B</div><div class="module-info"><b>Set B · Strategic Cost &amp; Performance Management</b><div class="bar"><i style="width:${pb}%"></i></div><small>${pb}% complete · ${b.c.filter((_,i)=>!(me.ch[b.p+i]>0)).length} remaining</small></div><strong>${pb}%</strong></div></div>`;
  h+=`<div class="card"><div class="section-head"><div><span class="eyebrow">STAY ON TRACK</span><h2 style="margin:3px 0 0">Exam countdown</h2></div></div><div class="exam-grid">${examBox("exam",a)}${examBox("examB",b)}</div><p class="muted" style="font-size:12px;margin-bottom:0">Set exam dates in the Study log tab.</p></div></div>`;
  const recent=(me.mocks||[]).slice(-3).reverse();
  h+=`<div class="grid-two"><div class="card"><div class="section-head"><div><span class="eyebrow">NEXT UP</span><h2 style="margin:3px 0 0">Suggested focus</h2></div><span class="pill">Study plan</span></div><p class="muted">Start with a chapter you haven't studied yet.</p><div class="focus-item"><span class="focus-dot"></span><div><b>${E(next(a))}</b><small>Set A · next suggested chapter</small></div></div><div class="focus-item"><span class="focus-dot violet-dot"></span><div><b>${E(next(b))}</b><small>Set B · next suggested chapter</small></div></div><div class="row" style="margin-top:14px"><button class="btn pri" onclick="setTab('ch')">Continue studying</button><button class="btn" onclick="setTab('log')">Log study time</button></div></div>`;
  h+=`<div class="card"><div class="section-head"><div><span class="eyebrow">TEST YOURSELF</span><h2 style="margin:3px 0 0">Mock test snapshot</h2></div><button class="btn" onclick="setTab('mk')">View tests ↗</button></div>${recent.length?recent.map(m=>`<div class="mock-row"><span>${E((m.s||"").split(" · ")[0])}<small>${E(m.d||"")}</small></span><b>${m.m}/${m.t}</b><strong>${m.t?Math.round(m.m/m.t*100):0}%</strong></div>`).join(""):`<p class="muted">No mock tests recorded yet. Add your first score when you're ready.</p>`}<button class="btn pri" onclick="setTab('mk')">Add mock test</button></div></div>`;
  h+=`<div class="grid-two"><div class="card"><div class="section-head"><div><span class="eyebrow">QUICK ACCESS</span><h2 style="margin:3px 0 0">Useful links</h2></div></div><a class="resource-link" href="https://www.icai.org/post/self-paced-online-modules-nset" target="_blank" rel="noopener noreferrer"><span>ICAI SPOM information</span><b>↗</b></a><a class="resource-link" href="https://spmt.icai.org/ICAI/LoginAction_input.action" target="_blank" rel="noopener noreferrer"><span>SPOM exam booking</span><b>↗</b></a><a class="resource-link" href="https://eservices.icai.org/" target="_blank" rel="noopener noreferrer"><span>ICAI SSP student portal</span><b>↗</b></a></div><div class="card"><div class="section-head"><div><span class="eyebrow">CONSISTENCY</span><h2 style="margin:3px 0 0">Your study rhythm</h2></div></div><div class="days">${Array.from({length:7},(_,i)=>{const k=back(6-i),v=s.days[k]||0,mx=Math.max(1,...Array.from({length:7},(_,j)=>s.days[back(j)]||0));return `<div><i style="height:${Math.max(3,v/mx*48)}px;opacity:${v?1:.22}"></i>${new Date(k+"T00:00").toLocaleDateString("en",{weekday:"short"}).slice(0,2)}<small>${v.toFixed(1)}h</small></div>`}).join("")}</div><p class="muted" style="font-size:12px;margin-bottom:0">Log study sessions regularly to keep your chart accurate.</p></div></div>`;
 }
 if(tab=="log"){
  h+=rings(s)+plan()+countdown(s)+goalTimer(s);
  h+=`<div class="stats"><div class="stat"><b>${s.wk.toFixed(1)}</b><span>hours, 7 days</span></div><div class="stat"><b>${s.st}</b><span>day streak</span></div><div class="stat"><b>${s.pct}%</b><span>chapters done</span></div></div>
  <div class="card"><div class="row"><input id="d" type="date" value="${back(0)}"><select id="s" class="grow">${opts}</select><input id="h" type="number" step="0.25" min="0" max="20" placeholder="Hours" style="width:90px"></div>
  <div class="row" style="margin-top:8px"><input id="n" class="grow" placeholder="What did you cover? (optional)"><button class="btn pri" onclick="addLog()">Add</button></div></div>`;
  const mx=Math.max(1,...Array.from({length:7},(_,i)=>s.days[back(6-i)]||0));
  h+=`<div class="card"><b>Last 7 days</b><div class="days">${Array.from({length:7},(_,i)=>{const k=back(6-i),v=s.days[k]||0;return `<div><i style="height:${v/mx*52}px"></i>${new Date(k+"T00:00").toLocaleDateString("en",{weekday:"short"}).slice(0,2)}</div>`}).join("")}</div></div>${heat()}${badges(s)}<h2>Recent sessions</h2>`;
  const L=me.logs.map((l,i)=>[l,i]).slice(-10).reverse();
  h+=L.length?L.map(([l,i])=>`<div class="card row"><div class="grow"><b>${l.h}h</b> · ${E(l.s.split(" · ")[0])}<br><span class="note">${E(l.d)}${l.n?" · "+E(l.n):""}</span></div><button class="x" onclick="delLog(${i})" aria-label="Delete">×</button></div>`).join(""):`<p class="note">No sessions yet. Log your first one above.</p>`;
 }
 if(tab=="ch"){
  h+=`<p class="note">Tap a box to move it along: ✓ studied, then R1, R2 and R3 for each revision pass, then back to blank.</p>`;
  SETS.forEach(S=>{const dn=S.c.filter((_,i)=>me.ch[S.p+i]>0).length;
   h+=`<h2>${E(S.n)}</h2><div class="bar"><i style="width:${dn/S.c.length*100}%"></i></div><p class="note">${dn} of ${S.c.length} studied · ${S.c.filter((_,i)=>me.ch[S.p+i]>=2).length} revised</p><div class="card" style="padding:4px 14px">`+S.c.map((c,i)=>{const v=me.ch[S.p+i]||0;return `<div class="ch"><button class="st s${v}" onclick="cyc('${S.p+i}')" aria-label="Toggle">${["","✓","R1","R2","R3"][v]}</button><span>${E(c)}</span></div>`}).join("")+`</div>`})}
 if(tab=="mk"){
  h+=`<div class="card"><div class="row"><select id="ms" class="grow">${opts}</select><input id="m" type="number" min="0" placeholder="Marks" style="width:90px"><input id="t" type="number" min="1" value="100" style="width:90px"><button class="btn pri" onclick="addMock()">Add</button></div></div>`;
  const M=me.mocks.map((m,i)=>[m,i]).reverse();
  h+=M.length?M.map(([m,i])=>`<div class="card row"><div class="grow"><b>${m.m}/${m.t}</b> (${Math.round(m.m/m.t*100)}%) · ${E(m.s.split(" · ")[0])}<br><span class="note">${E(m.d)}</span></div><button class="x" onclick="delMock(${i})" aria-label="Delete">×</button></div>`).join(""):`<p class="note">Add mock or test scores to see your trend.</p>`;h+=trend()+weakCard()}
 if(tab=="analytics")h+=mockAnalytics();
 if(tab=="focus")h+=focusView();
 if(tab=="ach")h+=achievementView();
 if(tab=="fr"){
  h+=`<details class="card"><summary><b>📘 Friends tab — How to use it</b></summary>
  <p class="note" style="margin:10px 0 6px">This tracker has no accounts or shared database. Friends compare progress by exchanging a share code manually.</p>
  <ol style="padding-left:22px;margin:8px 0">
  <li><b>Add your name.</b> Enter the name you want your friends to see.</li>
  <li><b>Copy your code.</b> Tap <em>Copy my code</em> and send it through WhatsApp, Telegram, email, or another method.</li>
  <li><b>Your friend does the same.</b> They open the tracker on their device, enter their name, copy their code, and send it back to you.</li>
  <li><b>Add their code.</b> Paste the code you received into the box under step 2 and tap <em>Add</em>. You can paste multiple codes together.</li>
  <li><b>Send fresh codes for updates.</b> Each code is a snapshot from when it was created. Exchange new codes whenever you want to update each other’s progress.</li>
  </ol>
  <p class="note" style="margin-bottom:6px"><b>What is shared:</b> your name, chapter completion percentage, daily study hours included in the code (used to calculate weekly hours and streak), and latest mock-test percentage.</p>
  <p class="note" style="margin-bottom:6px"><b>What is not shared:</b> individual chapter details, notes, and your full study log.</p>
  <p class="note" style="margin-bottom:6px"><b>Important:</b> there is no automatic syncing. You must exchange a fresh code to see updated progress. Share your code only with people you trust.</p>
  </details>
  <div class="card"><b>Share with friends</b><p class="note" style="margin:4px 0 10px">Each friend sends their code. Paste as many as you like at once, even a whole group chat. Hours and streaks are worked out from the daily hours inside each code, so ask friends for a fresh code every week.</p><div class="row"><input id="nm" class="grow" placeholder="Your name" value="${E(me.name||"")}" onchange="setName()"></div><p class="note" style="margin:10px 0 4px">1. Copy your code and send it to your friends:</p><textarea id="mc" readonly rows="3" class="ta" onclick="this.select()" style="width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px">${me.name?code():"Enter your name first"}</textarea><div class="row" style="margin-top:6px"><button class="btn" onclick="cp('mc')">Copy my code</button></div><p class="note" style="margin:10px 0 4px">2. Paste your friends’ codes (one or many):</p><div class="row"><textarea id="cd" rows="2" class="ta grow" placeholder="Paste codes here"></textarea><button class="btn pri" onclick="addCode()">Add</button></div></div>`;
  const R=Object.entries(all).map(([id,d])=>({id,s:stats(d)})).concat(ref?[]:[{id:"me",me:1,n:me.name||"You",s}]).concat(Object.entries(me.fr||{}).map(([n,f])=>({id:"fr:"+n,n,t:f.t,s:frStats(f)}))).sort((a,b)=>(b.s[SK]||0)-(a.s[SK]||0));
  h+=winner(R)+sortSel();h+=R.length?`<div class="card wrap"><table><tr><th>Name</th><th>7-day hrs</th><th>Streak</th><th>Chapters</th><th>Last mock</th></tr>`+R.map(r=>`<tr><td>${E(r.n||names[r.id]||"Friend")}${r.id==uid||r.me?" (you)":""}${r.t?` <span class="note">· ${E(r.t)}</span> <button class="x" onclick="delFr('${r.n}')" aria-label="Remove">×</button>`:""}</td><td>${r.s.wk.toFixed(1)}</td><td>${r.s.st==null?"–":r.s.st}</td><td>${r.s.pct}%</td><td>${r.s.mk==null?"–":r.s.mk+"%"}</td></tr>`).join("")+`</table></div>`:`<p class="note">Nobody has logged anything yet.</p>`}
 if(tab=="fr")h+=bkCard();
 if(tab=="res"){
  h+=`<div class="card"><b>Official ICAI SPOM resources</b><p class="note">The three official links you requested. Each opens in a new tab.</p>
  <div class="ch"><div class="grow"><b>SPOM / NSET information</b><br><span class="note">ICAI Self-Paced Online Modules information</span></div><a class="btn pri" href="https://www.icai.org/post/self-paced-online-modules-nset" target="_blank" rel="noopener noreferrer">Open ↗</a></div>
  <div class="ch"><div class="grow"><b>SPOM exam booking login</b><br><span class="note">Log in here to book your examination</span></div><a class="btn pri" href="https://spmt.icai.org/ICAI/LoginAction_input.action" target="_blank" rel="noopener noreferrer">Login ↗</a></div>
  <div class="ch"><div class="grow"><b>ICAI SSP student portal</b><br><span class="note">Student Self-Service Portal</span></div><a class="btn pri" href="https://eservices.icai.org/" target="_blank" rel="noopener noreferrer">Student login ↗</a></div>
  </div>`;
 }
 $("v").innerHTML=h}
render();
(async()=>{try{
 const user=await claude.use("user"),db=await claude.use("db");if(!user||!db)return;
 uid=await user.id();if(!uid)return;ref=db.doc("tracker/"+uid);
 db.collection("tracker").onSnapshot(async q=>{all={};q.docs.forEach(d=>all[d.id]=JSON.parse(JSON.stringify(d.data())));
  if(all[uid])me=Object.assign({ch:{},logs:[],mocks:[]},all[uid]);
  const ps=await user.profiles(Object.keys(all));for(const k in ps)names[k]=ps[k].name||"";render()},()=>{});
 render()}catch(e){}})();
